<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: app shell. Sticky header (HALP badge, scenario, save, actions) over two navigation rows:
   scenario-wide views and one tab per subject, then the subject's own sections.
   Colour: BMSS red as the brand accent, black for the badge and primary actions, warm neutrals. */
:root {
  --bg: #f4f3f2; --surface: #ffffff; --surface-2: #eceae8; --line: #dcd8d5; --line-strong: #bcb6b2;
  --fg: #1a1716; --fg-2: #4d4845; --fg-3: #76706c;
  --accent: #c1121f; --accent-fg: #ffffff; --accent-soft: #f8e0e1;
  --primary: #161212; --primary-fg: #ffffff;
  --badge: #0c0b0b; --badge-red: #e5232f; --badge-sub: #c9c4c1;
  --bad: #b3261e; --bad-soft: #fbe4e1; --warn: #93570a; --warn-soft: #fbefdb; --good: #2a7449; --good-soft: #e0f1e6;
  --chip-s: 62%; --chip-l: 90%; --chip-fs: 50%; --chip-fl: 24%;
  --shadow: 0 1px 2px rgb(26 18 16 / .06), 0 6px 20px rgb(26 18 16 / .08);
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121010; --surface: #1a1717; --surface-2: #231f1e; --line: #342e2d; --line-strong: #4b4342;
  --fg: #eeeaea; --fg-2: #b5adab; --fg-3: #8b8280;
  --accent: #ff5c63; --accent-fg: #2a0507; --accent-soft: #3d1517;
  --primary: #f1ecea; --primary-fg: #161212;
  --badge: #000000; --badge-red: #ff3b44; --badge-sub: #bdb6b3;
  --bad: #f2867c; --bad-soft: #3a1d1b; --warn: #efb560; --warn-soft: #382a14; --good: #72d39c; --good-soft: #15301f;
  --chip-s: 34%; --chip-l: 25%; --chip-fs: 70%; --chip-fl: 84%;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 6px 20px rgb(0 0 0 / .35);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #121010; --surface: #1a1717; --surface-2: #231f1e; --line: #342e2d; --line-strong: #4b4342;
  --fg: #eeeaea; --fg-2: #b5adab; --fg-3: #8b8280;
  --accent: #ff5c63; --accent-fg: #2a0507; --accent-soft: #3d1517;
  --primary: #f1ecea; --primary-fg: #161212;
  --badge: #000000; --badge-red: #ff3b44; --badge-sub: #bdb6b3;
  --bad: #f2867c; --bad-soft: #3a1d1b; --warn: #efb560; --warn-soft: #382a14; --good: #72d39c; --good-soft: #15301f;
  --chip-s: 34%; --chip-l: 25%; --chip-fs: 70%; --chip-fl: 84%;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 6px 20px rgb(0 0 0 / .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-stretch: 85%; letter-spacing: .005em; text-wrap: balance; margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1440px; margin: 0 auto; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
@media (max-width: 640px) { .top { position: static; } .brand h1 { font-size: 15px; } .logo-word { font-size: 20px; } }
.top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 10px 6px; }
.brand { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; min-width: 0; flex: 1 1 320px; }
.logo { display: inline-grid; justify-items: center; background: var(--badge); border-radius: 7px; padding: 5px 11px 4px; line-height: 1; box-shadow: inset 0 0 0 1px rgb(255 255 255 / .08); }
.logo-word { font-family: var(--f-display); font-stretch: 80%; font-weight: 800; font-size: 23px; letter-spacing: .06em; color: var(--badge-red); }
.logo-sub { font-family: var(--f-mono); font-size: 9px; font-weight: 600; letter-spacing: .14em; color: var(--badge-sub); margin-top: 3px; white-space: nowrap; }
.brand h1 { font-size: 18px; font-weight: 650; color: var(--fg-2); }
.brand h1 i { font-style: normal; color: var(--accent); font-weight: 800; }
.scn-name { min-width: 0; flex: 1 1 160px; max-width: 320px; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 4px 8px; font-weight: 500; color: var(--fg-2); }
.scn-name:hover { border-color: var(--line); }
.scn-name:focus { border-color: var(--accent); background: var(--surface); color: var(--fg); outline: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--surface-2); color: var(--fg-2); }
.pill.dirty { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 7px; padding: 6px 12px; cursor: pointer; font-weight: 500; white-space: nowrap; min-height: 34px; text-decoration: none; }
.btn:hover:not(:disabled) { border-color: var(--fg-3); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--fg-2); }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); }
.btn.small { padding: 3px 8px; min-height: 28px; font-size: 13px; }
.btn.danger { color: var(--bad); }
.icon { width: 16px; height: 16px; flex: none; }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; align-items: stretch; }
.nav::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 9px 12px 8px; cursor: pointer; color: var(--fg-2); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab .count { font-family: var(--f-mono); font-size: 11px; color: var(--fg-3); }
.tab .count.bad { color: var(--bad); font-weight: 600; }
.tab.subj { font-weight: 600; }
.tab.subj .code { font-family: var(--f-mono); font-size: 11px; color: var(--fg-3); font-weight: 500; }
.nav .sep { width: 1px; background: var(--line); margin: 8px 6px; flex: none; }
.tab.add { color: var(--accent); }
.subnav { display: flex; gap: 4px; padding: 8px 0 10px; overflow-x: auto; scrollbar-width: none; }
.subnav::-webkit-scrollbar { display: none; }
.subtab { border: 1px solid var(--line); background: var(--surface); padding: 4px 12px; border-radius: 999px; cursor: pointer; color: var(--fg-2); font-weight: 500; white-space: nowrap; font-size: 13px; }
.subtab[aria-selected="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
main { padding-block: 18px 48px; }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin-bottom: 12px; }
.section-head h2 { font-size: 22px; font-weight: 700; }
.lede { color: var(--fg-2); max-width: 70ch; margin: 4px 0 0; }
.muted { color: var(--fg-3); }

/* notices */
.banner { border: 1px solid var(--line); border-left: 4px solid var(--accent); background: var(--surface); border-radius: var(--r); padding: 12px 14px; margin-bottom: 14px; display: grid; gap: 6px; }
.banner.bad { border-left-color: var(--bad); }
.banner.warn { border-left-color: var(--warn); }
.banner.good { border-left-color: var(--good); }
.banner .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; justify-content: space-between; }
.banner strong { font-weight: 600; }
.banner ul { margin: 2px 0 0; padding-left: 18px; color: var(--fg-2); }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.tile .k { font-size: 12px; color: var(--fg-3); text-transform: uppercase; letter-spacing: .06em; }
.tile .v { font-family: var(--f-display); font-stretch: 85%; font-size: 28px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 15px; color: var(--fg-3); font-weight: 600; }
.tile.bad .v { color: var(--bad); } .tile.warn .v { color: var(--warn); } .tile.good .v { color: var(--good); }
@media (max-width: 640px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* board */
.board-layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 18px; align-items: start; }
@media (max-width: 1100px) { .board-layout { grid-template-columns: minmax(0, 1fr); } }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 14px; overflow: hidden; }
.group > h3 { font-size: 15px; font-weight: 700; padding: 9px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; }
.group > h3 span { font-family: var(--f-body); font-stretch: 100%; font-weight: 400; font-size: 12px; color: var(--fg-3); }
.lvl { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
.lvl:first-of-type { border-top: 0; }
.lvl-label { display: grid; align-content: start; gap: 4px; }
.lvl-label .code { font-family: var(--f-mono); font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.ticks { display: flex; gap: 2px; flex-wrap: wrap; }
.ticks i { width: 6px; height: 10px; border-radius: 1px; background: var(--line-strong); }
.lvl-label .per { font-size: 12px; color: var(--fg-3); }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.slot { border: 1px solid var(--line); border-radius: 7px; padding: 8px; display: grid; gap: 6px; background: var(--surface); }
.slot.pinned { border-color: var(--line-strong); background: var(--surface-2); }
.slot.hard { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
.slot.soft:not(.hard) { border-color: var(--warn); }
.slot.comb { border-left: 3px solid var(--fg-3); }
.combtag { font-family: var(--f-mono); font-size: 11px; font-weight: 600; color: var(--fg-2); background: var(--surface-2); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; }
.slot-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.slot-name { font-family: var(--f-mono); font-weight: 600; }
.flagdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-left: 6px; vertical-align: middle; }
.flagdot.hard { background: var(--bad); } .flagdot.soft { background: var(--warn); }
.pinbtn { border: 0; background: none; padding: 3px; border-radius: 5px; cursor: pointer; color: var(--fg-3); display: inline-flex; }
.pinbtn:hover:not(:disabled) { background: var(--surface-2); color: var(--fg); }
.pinbtn[aria-pressed="true"] { color: var(--accent); }
.pinbtn:disabled { opacity: .35; cursor: default; }
.who { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; background: var(--surface-2); font-weight: 600; cursor: pointer; }
.who.empty { color: var(--fg-3); font-weight: 400; background: var(--surface); border-style: dashed; }
.sec-row { display: flex; gap: 4px; align-items: center; }
.sec-row .who { font-weight: 500; font-size: 13px; padding: 3px 6px; }
.addsec { border: 0; background: none; color: var(--fg-3); font-size: 12px; padding: 2px 0; cursor: pointer; text-align: left; }
.addsec:hover { color: var(--accent); }
.x { border: 0; background: none; color: var(--fg-3); cursor: pointer; padding: 3px; border-radius: 4px; display: inline-flex; }
.x:hover { color: var(--bad); background: var(--bad-soft); }

/* person colour chips */
.pc { background: hsl(var(--h) var(--chip-s) var(--chip-l)); color: hsl(var(--h) var(--chip-fs) var(--chip-fl)); border-color: transparent; }
.pc0 { --h: 205 } .pc1 { --h: 22 } .pc2 { --h: 150 } .pc3 { --h: 275 } .pc4 { --h: 45 } .pc5 { --h: 335 }
.pc6 { --h: 185 } .pc7 { --h: 95 } .pc8 { --h: 0 } .pc9 { --h: 240 } .pc10 { --h: 60 } .pc11 { --h: 305 }
.pc12 { --h: 220 } .pc13 { --h: 35 } .pc14 { --h: 165 } .pc15 { --h: 290 } .pc16 { --h: 75 } .pc17 { --h: 350 } .pc18 { --h: 130 } .pc19 { --h: 255 }
.pc12, .pc13, .pc14, .pc15, .pc16, .pc17, .pc18, .pc19 { box-shadow: inset 0 0 0 1.5px hsl(var(--h) var(--chip-fs) var(--chip-fl) / .6); }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 5px; padding: 1px 7px; font-weight: 600; font-size: 13px; border: 1px solid var(--line); white-space: nowrap; }
.chip.lite { font-weight: 500; background: var(--surface-2); color: var(--fg-2); border-color: transparent; }
.chip.mono { font-family: var(--f-mono); font-weight: 500; font-size: 12px; }

/* side panel */
.side { display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 150px); }
@media (max-width: 1100px) { .side { position: static; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.panel > h3 { font-size: 15px; font-weight: 700; padding: 10px 14px 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel > h3 .pill { font-family: var(--f-body); font-stretch: 100%; }
.panel .body { padding: 8px 14px 12px; }
.issue { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); }
.issue:first-child { border-top: 0; }
.rank { font-family: var(--f-mono); font-size: 12px; color: var(--fg-3); min-width: 26px; padding-top: 1px; }
.sev { width: 6px; border-radius: 3px; align-self: stretch; }
.sev.bad { background: var(--bad); } .sev.warn { background: var(--warn); } .sev.good { background: var(--good); } .sev.info { background: var(--line-strong); }
.issue .t { font-weight: 500; }
.issue .d { color: var(--fg-2); font-size: 13px; }
.ok-line { display: flex; align-items: center; gap: 8px; color: var(--good); font-weight: 500; padding: 4px 0; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 500; font-size: 12px; color: var(--fg-3); text-transform: uppercase; letter-spacing: .05em; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
.off { color: var(--warn); font-weight: 600; }
.near { color: var(--good); font-weight: 600; }
.over { color: var(--bad); font-weight: 600; }
.slotlist { font-family: var(--f-mono); font-size: 12.5px; color: var(--fg-2); }
.slotlist em { font-style: normal; color: var(--fg-3); }

/* overview */
.subj-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 10px; margin-bottom: 16px; }
.subj-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; }
.subj-card h3 { font-size: 17px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.subj-card h3 .mono { font-size: 12px; color: var(--fg-3); font-weight: 500; }
.subj-card .facts { display: flex; flex-wrap: wrap; gap: 6px; }
.ov th.subj { color: var(--fg-2); }
.ov td.cls { min-width: 140px; }
.ov td.cls .n { font-size: 12px; color: var(--fg-3); margin-top: 2px; }
.ov tfoot td { font-weight: 600; border-top: 2px solid var(--line); border-bottom: 0; }
.ov .person { white-space: nowrap; }
.capnote { font-size: 12px; }

/* forms */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 12px; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; justify-content: space-between; margin-bottom: 10px; }
.card-head h3 { font-size: 16px; font-weight: 700; }
.field { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: var(--surface); min-width: 0; }
.field:focus { border-color: var(--accent); outline: none; }
.field.num { width: 64px; font-family: var(--f-mono); text-align: right; }
.field.name { width: 100%; max-width: 220px; font-weight: 600; }
.field.code { width: 90px; font-family: var(--f-mono); font-weight: 600; }
.lvl-edit { display: grid; grid-template-columns: 110px 96px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.lvl-edit:first-of-type { border-top: 0; }
.lvl-edit label, .lbl { font-size: 12px; color: var(--fg-3); display: grid; gap: 3px; }
.slot-edit { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.slot-chip { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
.slot-chip input { border: 0; background: transparent; width: 72px; padding: 4px 6px; font-family: var(--f-mono); font-weight: 600; }
.slot-chip input.size { width: 46px; border-left: 1px solid var(--line); font-weight: 500; color: var(--fg-2); text-align: right; }
.sizetag { font-family: var(--f-mono); font-size: 11px; color: var(--fg-3); margin-left: 6px; }
.slot-chip input:focus { outline: none; }
.slot-chip:focus-within { border-color: var(--accent); }
@media (max-width: 640px) { .lvl-edit { grid-template-columns: 1fr 1fr; } .lvl-edit .slot-edit { grid-column: 1 / -1; } .lvl-edit > .x { justify-self: end; grid-column: 2; grid-row: 1; } }
.people-tbl td { vertical-align: middle; }
.swatch { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tagbtn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 2px 10px; cursor: pointer; font-size: 12.5px; font-weight: 500; color: var(--fg-3); white-space: nowrap; }
.tagbtn[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); font-weight: 600; }
.subj-meta { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
.limit-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 12.5px; color: var(--fg-3); }
.limit-row label { display: inline-flex; align-items: center; gap: 6px; }
.limit-row .field.num { width: 54px; padding: 3px 6px; }

/* rules */
.rule { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 12px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.rule:first-child { border-top: 0; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 3px 9px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--fg-3); }

<script>
/* Deployment engine: compile a scenario, evaluate a board, and search for the best board.
   Written as one self-contained function so the same source runs on the page and in a worker. */
function DeployEngine() {
  const BIG = 1 << 20;
  const popc = (m) => { let c = 0; while (m) { m &= m - 1; c++; } return c; };

  function compile(sc) {
    const people = (sc.people || []).slice(0, 20);
    const pIdx = {}; people.forEach((p, i) => (pIdx[p.id] = i));
    const levels = [], slots = [], lIdx = {}, sIdx = {};
    (sc.groups || []).forEach((g) => (g.levels || []).forEach((l) => {
      const li = levels.length; lIdx[l.id] = li;
      const per = Math.max(0, +l.periods || 0);
      levels.push({ id: l.id, name: l.name, groupName: g.name, periods: per, slots: [] });
      (l.slots || []).forEach((s) => {
        const si = slots.length; sIdx[s.id] = si;
        slots.push({ id: s.id, name: s.name, level: li, periods: per, fixed: !!s.fixed, countDep: s.countDep !== false, allowIds: s.allow || null });
        levels[li].slots.push(si);
      });
    }));
    const P = people.length, S = slots.length, L = levels.length;
    const pmask = (ids) => (ids || []).reduce((m, id) => (pIdx[id] != null ? m | (1 << pIdx[id]) : m), 0);
    const plist = (ids) => (ids || []).map((id) => pIdx[id]).filter((x) => x != null);
    const llist = (ids) => [...new Set((ids || []).map((id) => lIdx[id]).filter((x) => x != null))];
    const slist = (ids) => [...new Set((ids || []).map((id) => sIdx[id]).filter((x) => x != null))];
    const num = (v) => (v === null || v === undefined || v === '' || isNaN(+v) ? null : +v);

    const rules = [];
    (sc.rules || []).forEach((r) => {
      const c = { id: r.id, kind: r.kind, hard: !!r.hard, raw: r };
      switch (r.kind) {
        case 'mustSlots': c.p = pIdx[r.person]; c.sl = slist(r.slots); if (c.p == null || !c.sl.length) return; break;
        case 'avoidLevels': c.p = pIdx[r.person]; c.lv = llist(r.levels); if (c.p == null || !c.lv.length) return; break;
        case 'periodsCap': c.p = pIdx[r.person]; c.n = num(r.n); if (c.p == null || c.n == null) return; break;
        case 'coverLevels': c.pl = plist(r.people); c.pm = pmask(r.people); c.lv = llist(r.levels); c.n = Math.max(1, num(r.min) || 1);
          if (!c.pl.length || !c.lv.length) return; break;
        case 'samePerson': case 'differentPeople': case 'combined': c.sl = slist(r.slots); if (c.sl.length < 2) return; break;
        case 'preferPeople': c.sl = slist(r.slots); c.pm = pmask(r.people); if (!c.sl.length || !c.pm) return; break;
        case 'moreThan': c.up = plist(r.upper); c.lo = plist(r.lower); if (!c.up.length || !c.lo.length) return; break;
        case 'comboCap': c.n = num(r.n); if (c.n == null) return; break;
        case 'targets': case 'periodNorm': case 'atLeastOne': break;
        default: return;
      }
      rules.push(c);
    });
    const soft = rules.filter((r) => !r.hard);
    const rankPos = {}; (sc.rank || []).forEach((id, i) => (rankPos[id] = i));
    soft.sort((a, b) => (rankPos[a.id] ?? 1e6) - (rankPos[b.id] ?? 1e6));
    const hard = rules.filter((r) => r.hard);
    // Shared level cap. Soft: a tier above every preference, so it is only exceeded when hard rules force it.
    const cap = sc.levelCap && num(sc.levelCap.n) != null ? { n: num(sc.levelCap.n), hard: !!sc.levelCap.hard } : null;
    if (cap && !cap.hard) soft.unshift({ id: '__cap', kind: 'comboCap', hard: false, n: cap.n, raw: { id: '__cap', kind: 'comboCap', n: cap.n } });
    const capHard = cap && cap.hard ? cap.n : null;
    slots.forEach((s) => { s.allow = s.allowIds ? pmask(s.allowIds) : (1 << P) - 1; });

    const target = people.map((p) => num(p.target));
    const lim = limits({ people, S, L, hard, target, capHard }, new Set());
    const minDep = lim.minDep, maxDep = lim.maxDep, maxCombos = lim.maxCombos, maxPer = lim.maxPer, minPer = lim.minPer;
    // period norm (soft) and the periods other subjects could still add, so a subject generated first is not
    // made to carry a person's whole load on its own
    const norm = people.map((p) => num(p.normPeriods));
    const potOther = people.map((p) => Math.max(0, num(p.potOther) || 0));
    const tagMask = pmask(sc.tagged);
    // periods a person carries outside the classes here (a form class), counted in their load from the start
    const basePer = people.map((p) => Math.max(0, num(p.basePeriods) || 0));

    const clashOf = slots.map(() => []);
    const clashes = [];
    (sc.clashes || []).forEach((c) => {
      const a = sIdx[c.a], b = sIdx[c.b];
      if (a == null || b == null || a === b) return;
      clashOf[a].push(b); clashOf[b].push(a); clashes.push({ id: c.id, a, b });
    });
    // Combined classes: slots taught together as one lesson. Whatever a person holds within one set counts as a
    // single deployment and the set's periods once (the longest slot's periods). A slot belongs to one set at most.
    const sets = [], setOf = new Int16Array(S).fill(-1);
    (sc.combined || []).forEach((c) => {
      const sl = slist(c.slots).filter((x) => setOf[x] < 0);
      if (sl.length < 2) return;
      const ci = sets.length; sl.forEach((x) => (setOf[x] = ci));
      sets.push({ sl, per: Math.max(...sl.map((x) => slots[x].periods)) });
    });
    const mustLv = mustLevels(people, hard);
    const impliedMin = impliedMins({ people, hard, slots, levels, mustLv, minDep, setOf });
    const slotRules = slots.map(() => []);
    rules.forEach((r) => (r.sl || []).forEach((s) => slotRules[s].push(r.id)));

    // a concurrent pair inside one combined set would forbid the very thing the set describes, so it is ignored
    for (let a = 0; a < S; a++) clashOf[a] = clashOf[a].filter((b) => setOf[a] < 0 || setOf[a] !== setOf[b]);
    for (let i = clashes.length - 1; i >= 0; i--) if (setOf[clashes[i].a] >= 0 && setOf[clashes[i].a] === setOf[clashes[i].b]) clashes.splice(i, 1);
    const prim = new Int8Array(S).fill(-1), sec = new Int8Array(S).fill(-1), pinned = new Uint8Array(S), fixedSlot = new Uint8Array(S);
    slots.forEach((s, i) => { if (s.fixed) fixedSlot[i] = 1; });
    const A = sc.assign || {};
    slots.forEach((s, i) => {
      const a = A[s.id]; if (!a) return;
      const p0 = a.p && a.p[0] != null ? pIdx[a.p[0]] : undefined;
      const p1 = a.p && a.p[1] != null ? pIdx[a.p[1]] : undefined;
      if (p0 != null) prim[i] = p0;
      if (p1 != null && p1 !== p0) sec[i] = p1;
      if (a.pin && p0 != null) pinned[i] = 1;
    });
    return { people, levels, slots, P, S, L, rules, soft, hard, minDep, maxDep, target, maxCombos, maxPer, minPer, norm, potOther, tagMask, basePer, capHard, clashOf, clashes, slotRules, prim, sec, pinned, fixedSlot, mustLv, impliedMin, sets, setOf };
  }

  function makeState(M) {
    const { P, L, S } = M;
    return { prim: new Int8Array(S).fill(-1), sec: new Int8Array(S).fill(-1), dep: new Int16Array(P), periods: Int32Array.from(M.basePer || new Array(P).fill(0)),
      lc: new Int16Array(P * L), combos: new Int16Array(P), remLv: new Int16Array(L), R: 0, cc: new Int16Array(Math.max(1, M.sets.length) * P) };
  }
  function add(M, st, p, s) {
    const sl = M.slots[s], c = M.setOf[s];
    if (c < 0) { if (sl.countDep) st.dep[p]++; st.periods[p] += sl.periods; }
    else if (st.cc[c * M.P + p]++ === 0) { if (sl.countDep) st.dep[p]++; st.periods[p] += M.sets[c].per; }
    if (st.lc[p * M.L + sl.level]++ === 0) st.combos[p]++;
  }
  function rem(M, st, p, s) {
    const sl = M.slots[s], c = M.setOf[s];
    if (c < 0) { if (sl.countDep) st.dep[p]--; st.periods[p] -= sl.periods; }
    else if (--st.cc[c * M.P + p] === 0) { if (sl.countDep) st.dep[p]--; st.periods[p] -= M.sets[c].per; }
    if (--st.lc[p * M.L + sl.level] === 0) st.combos[p]--;
  }
  // Most open slots that could still add no deployment: in each combined class, every open slot once someone
  // teaches part of it, otherwise all but one.
  function absorbable(M, st) {
    if (!st.absorb) return 0;
    let A = 0;
    for (const c of M.sets) {
      let open = 0, held = false;
      for (const s of c.sl) { if (st.prim[s] >= 0 || st.sec[s] >= 0) held = true; else if (st.open && st.open[s]) open++; }
      A += held ? open : Math.max(0, open - 1);
    }
    return A;
  }
  // Least possible target deviation, given current deviation (O over, U short of which D cannot be filled),
  // R open slots of which up to A may add no deployment, and whether anyone untargeted can take leftovers.
  function targetsLB(O, U, D, R, A, free) {

/* ---------- Generate (runs in a worker so the page stays responsive) ---------- */
let workerURL = null;
function makeWorker() {
  try {
    if (!workerURL) {
      const src = DeployEngine.toString() + '\nconst E = DeployEngine();\nonmessage = (e) => { const m = e.data; const f = E.flatten(m.sc, m.focus);\n if (m.type === "solve") { const r = E.solve(f, { timeLimit: m.timeLimit, onProgress: (p) => postMessage({ type: "progress", ms: p.ms, best: p.best, assign: p.assign }) }); postMessage({ type: "done", result: r }); }\n if (m.type === "diagnose") postMessage({ type: "diag", fixes: E.diagnose(f, { timeLimit: m.timeLimit }) });\n};';
      workerURL = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    }
    return new Worker(workerURL);
  } catch (e) { return null; }
}
function runSolve(timeLimit) {

  const finish = (r) => {
    if (finished) return; finished = true;
    if (w) w.terminate();
    S.solving = null;
    if (!r.ok) { S.banner = { subject: focus, type: 'fail', problems: r.problems || ['No deployment found'] }; S.view = { top: focus, sub: 'board' }; render(); return; }

    for (const sid of slotIds) { const a = cur.assign[sid]; if (a && a.pin) pinned++; else if (!a || a.p[0] !== r.assign[sid]) changed++; }

    S.banner = { subject: focus, type: 'done', proven: r.proven, closest: r.closest, stopped: !!r.stopped, ms: r.ms, changed, pinned, canUndo: changed > 0 };
    S.view = { top: focus, sub: 'board' }; render();

  w = makeWorker();
  if (w) {
    w.onmessage = (e) => {
      const m = e.data;
      if (m.type === 'progress') {
        if (S.solving) S.solving.progress = m;

function resetBrowser() {

  S.pop = null; S.pending = null; S.confirm = null; S.banner = null; S.view = { top: 'overview', sub: 'board' }; S.setupName = null; S.setupPick = null;
  if (S.mode !== 'cloud') { S.list = []; S.setups = []; }
