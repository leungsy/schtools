/* ============================================================
   Class list manager
   ============================================================ */
function openClassManager(selectId) {
  let sel = store.classes.some(c => c.id === selectId) ? selectId : (store.classes[0] ? store.classes[0].id : null);
  let dirty = false;
  const list = h('div', { class: 'cm-list' });
  const nameIn = h('input', { class: 'input', type: 'text', maxlength: 60, placeholder: 'e.g. 3E2 Social Studies' });
  const ta = h('textarea', { class: 'input cm-names', rows: 12, placeholder: 'One name per line, for example:\nAisha\nBen Tan\nChloe Lim' });
  const count = h('span', { class: 'muted' });
  const note = h('div', { class: 'note', role: 'status' });
  const delBtn = h('button', { class: 'btn danger small', type: 'button' }, icon('trash'), 'Delete');
  const sortBtn = h('button', { class: 'btn small', type: 'button' }, 'Sort A–Z');
  const saveBtn = h('button', { class: 'btn primary small', type: 'button' }, 'Save class');
  const parse = () => ta.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const updateCount = () => { const n = parse().length; count.textContent = n + (n === 1 ? ' name' : ' names'); };
  function drawList() {
    list.textContent = '';
    store.classes.forEach(c => list.append(h('button', { class: 'cm-item' + (c.id === sel ? ' on' : ''), type: 'button', onclick: () => { if (commit(true)) { sel = c.id; loadSel(); } } }, h('span', { text: c.name }), h('small', { text: String(c.names.length) }))));
    list.append(h('button', { class: 'cm-item cm-new' + (sel === null ? ' on' : ''), type: 'button', onclick: () => { if (commit(true)) { sel = null; loadSel(); } } }, '+ New class'));
  }
  function loadSel() {
    const c = store.classes.find(x => x.id === sel);
    nameIn.value = c ? c.name : ''; ta.value = c ? c.names.join('\n') : '';
    delBtn.hidden = !c; note.textContent = ''; dirty = false;
    updateCount(); drawList();
    (c ? ta : nameIn).focus();
  }
  function commit(quiet) {
    if (!dirty) return true;
    const name = nameIn.value.trim(); const raw = parse();
    if (!name && !raw.length) { dirty = false; return true; }
    if (!name) { note.textContent = 'Give the class a name first.'; nameIn.focus(); return false; }
    if (!raw.length) { note.textContent = 'Add at least one name.'; ta.focus(); return false; }
    const names = dedupe(raw);
    let c = store.classes.find(x => x.id === sel);
    if (!c) { c = { id: uid(), name, names }; store.classes.push(c); sel = c.id; }
    else { c.name = name; c.names = names; }
    ta.value = names.join('\n'); dirty = false;
    save(); drawList(); updateCount(); refreshPickers();
    const merged = raw.length - names.length;
    note.textContent = merged ? `Saved. ${merged} repeated name${merged > 1 ? 's were' : ' was'} merged — add an initial to tell students apart.` : (quiet ? '' : `Saved “${name}”.`);
    return true;
  }
  nameIn.addEventListener('input', () => { dirty = true; });
  ta.addEventListener('input', () => { dirty = true; updateCount(); });
  saveBtn.addEventListener('click', () => { dirty = true; commit(false); });
  sortBtn.addEventListener('click', () => { ta.value = parse().sort((a, b) => a.localeCompare(b)).join('\n'); dirty = true; });
  delBtn.addEventListener('click', async () => {
    const c = store.classes.find(x => x.id === sel); if (!c) return;
    if (!(await confirmBox('Delete class?', `Delete “${c.name}” and its ${c.names.length} names? This can't be undone (unless you have a backup file).`, 'Delete class', true))) return;
    store.classes = store.classes.filter(x => x !== c);
    sel = store.classes[0] ? store.classes[0].id : null; dirty = false;
    save(); loadSel(); refreshPickers();
  });
  const body = h('div', { class: 'cm' }, list, h('div', { class: 'cm-edit' },
    field('Class name', nameIn), field('Names — one per line (you can paste a column from Excel)', ta),
    h('div', { class: 'cm-row' }, count, h('span', { class: 'spacer' }), sortBtn, delBtn, saveBtn), note));
  openModal({
    title: 'Class lists', body, wide: true,
    actions: [{ label: 'Done', kind: 'primary', onClick: () => commit(true) }],
  });
  loadSel();
}
function refreshPickers() { rerenderType(['picker', 'groups']); }

/* ============================================================
   Board rendering, drag & resize
   ============================================================ */
const boardEl = $('#board');
const instances = new Map(); // id -> {el, inst, w}

function topZ() { return board().widgets.reduce((m, w) => Math.max(m, w.z || 1), 0); }
function bringToFront(w, el) {
  const z = topZ(); if (w.z === z && board().widgets.filter(x => x.z === z).length === 1) return;
  w.z = z + 1; el.style.zIndex = w.z; save();
}
function place(el, w) { el.style.left = w.x + '%'; el.style.top = w.y + '%'; el.style.width = w.w + '%'; el.style.height = w.h + '%'; el.style.zIndex = w.z; }

function mountWidget(w, animate) {
  const app = APPS[w.type];
  const el = h('section', { class: `w w-${w.type}` + (app.bare ? ' bare' : '') + (animate ? ' enter' : ''), 'data-id': w.id, 'aria-label': app.label });
  const head = h('div', { class: 'w-head' },
    h('div', { class: 'w-title' }, icon(app.icon), h('span', { text: app.label })),
    h('div', { class: 'w-actions' },
      app.settings ? h('button', { type: 'button', title: 'Settings', 'aria-label': app.label + ' settings', onclick: () => openWidgetSettings(w) }, icon('gear')) : null,
      h('button', { type: 'button', title: 'Remove', 'aria-label': 'Remove ' + app.label, onclick: () => removeWidget(w.id) }, icon('close'))));
  const body = h('div', { class: 'w-body' });
  const grip = h('div', { class: 'w-resize', title: 'Drag to resize', 'aria-hidden': 'true' });
  el.append(head, body, grip);
  place(el, w);
  boardEl.append(el);
  el.addEventListener('pointerdown', () => bringToFront(w, el), true);
  enableDrag(head, el, w); enableResize(grip, el, w);
  const ctx = { el, save, rerender: () => rerenderWidget(w.id) };
  let inst = {};
  try { inst = app.mount(body, w, ctx) || {}; }
  catch (e) { console.error(e); body.append(h('p', { style: 'padding:16px', text: 'This app could not load. Remove it and add it again.' })); }
  instances.set(w.id, { el, inst, w, body, ctx });
  if (animate) setTimeout(() => el.classList.remove('enter'), 300);
}
function unmountWidget(id) {
  const rec = instances.get(id); if (!rec) return;
  try { rec.inst.destroy && rec.inst.destroy(); } catch (e) { /* ignore */ }
  rec.el.remove(); instances.delete(id);
}
function rerenderWidget(id) {
  const rec = instances.get(id); if (!rec) return;
  try { rec.inst.destroy && rec.inst.destroy(); } catch (e) { /* ignore */ }
  rec.body.textContent = '';
  rec.el.classList.remove('done', 'cue-green', 'cue-amber', 'cue-red');
  try { rec.inst = APPS[rec.w.type].mount(rec.body, rec.w, rec.ctx) || {}; }
  catch (e) { console.error(e); rec.inst = {}; }
}
function openWidgetSettings(w) {
  const rec = instances.get(w.id); if (!rec) return;
  const app = APPS[w.type];
  openModal({ title: app.label + ' settings', body: h('div', { class: 'form' }, app.settings(w, rec.ctx)), actions: [{ label: 'Done', kind: 'primary' }] });
}
function removeWidget(id) {
  const b = board(); const i = b.widgets.findIndex(w => w.id === id); if (i < 0) return;
  const [w] = b.widgets.splice(i, 1);
  unmountWidget(id); save(); updateEmpty();
  const bid = b.id;
  toast(APPS[w.type].label + ' removed', { label: 'Undo', fn: () => {
    const target = store.boards.find(x => x.id === bid); if (!target) return;
    target.widgets.splice(Math.min(i, target.widgets.length), 0, w); save();
    if (store.activeBoardId === bid) { mountWidget(w, true); updateEmpty(); }
  } });
}

function enableDrag(handle, el, w) {
  handle.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('button')) return;
    e.preventDefault();
    const B = boardEl.getBoundingClientRect(), R = el.getBoundingClientRect();
    const ox = e.clientX - R.left, oy = e.clientY - R.top;
    handle.setPointerCapture(e.pointerId); el.classList.add('dragging');
    const move = ev => {
      const x = clamp(ev.clientX - B.left - ox, 0, Math.max(0, B.width - R.width));
      const y = clamp(ev.clientY - B.top - oy, 0, Math.max(0, B.height - R.height));
      w.x = x / B.width * 100; w.y = y / B.height * 100;
      el.style.left = w.x + '%'; el.style.top = w.y + '%';
    };
    const up = () => {
      handle.removeEventListener('pointermove', move); handle.removeEventListener('pointerup', up); handle.removeEventListener('pointercancel', up);
      el.classList.remove('dragging'); save();
    };
    handle.addEventListener('pointermove', move); handle.addEventListener('pointerup', up); handle.addEventListener('pointercancel', up);
  });
}
function enableResize(grip, el, w) {
  const [minW, minH] = APPS[w.type].min || [160, 120];
  grip.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    const B = boardEl.getBoundingClientRect(), R = el.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    grip.setPointerCapture(e.pointerId); el.classList.add('dragging');
    const move = ev => {
      const wp = clamp(R.width + ev.clientX - sx, Math.min(minW, B.width), B.right - R.left);
      const hp = clamp(R.height + ev.clientY - sy, Math.min(minH, B.height), B.bottom - R.top);
      w.w = wp / B.width * 100; w.h = hp / B.height * 100;
      el.style.width = w.w + '%'; el.style.height = w.h + '%';
    };
    const up = () => {
      grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); grip.removeEventListener('pointercancel', up);
      el.classList.remove('dragging'); save();
    };
    grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up); grip.addEventListener('pointercancel', up);
  });
}

function findSpot(wpx, hpx, B) {
  const rects = board().widgets.map(w => ({ x: w.x / 100 * B.width, y: w.y / 100 * B.height, w: w.w / 100 * B.width, h: w.h / 100 * B.height }));
  const padPx = 16, step = 24, gap = 10;
  const overlap = (x, y) => rects.reduce((s, r) => s + Math.max(0, Math.min(x + wpx + gap, r.x + r.w) - Math.max(x, r.x - gap)) * Math.max(0, Math.min(y + hpx + gap, r.y + r.h) - Math.max(y, r.y - gap)), 0);
  let best = null, bestA = Infinity;
  for (let y = padPx; y + hpx <= B.height - padPx; y += step)
    for (let x = padPx; x + wpx <= B.width - padPx; x += step) {
      const a = overlap(x, y);
      if (a === 0) return { x, y };
      if (a < bestA) { bestA = a; best = { x, y }; }
    }
  return best || { x: Math.max(0, (B.width - wpx) / 2), y: Math.max(0, (B.height - hpx) / 2) };
}
function addWidget(type) {
  const app = APPS[type]; const B = boardEl.getBoundingClientRect();
  const wpx = Math.min(app.size[0], B.width - 24), hpx = Math.min(app.size[1], B.height - 24);
  const p = findSpot(wpx, hpx, B);
  const w = { id: uid(), type, x: p.x / B.width * 100, y: p.y / B.height * 100, w: wpx / B.width * 100, h: hpx / B.height * 100, z: topZ() + 1, data: app.defaults() };
  board().widgets.push(w); save(); mountWidget(w, true); updateEmpty();
}

function updateEmpty() { $('#emptyHint').hidden = board().widgets.length > 0; }
function renderBoard() {
  for (const id of [...instances.keys()]) unmountWidget(id);
  const b = board();
  const bg = BGS[b.bg] || BGS.cream;
  document.body.style.setProperty('--board', bg.c);
  boardEl.classList.toggle('dark', !!bg.dark);
  [...b.widgets].forEach(w => mountWidget(w, false));
  updateEmpty();
  renderBoardSelect(); renderBgMenu();
  document.title = b.name + ' · CRToolbox';
}
function renderBoardSelect() {
  const s = $('#boardSelect'); s.textContent = '';
  store.boards.forEach(b => { const o = h('option', { value: b.id }, b.name); if (b.id === store.activeBoardId) o.selected = true; s.append(o); });
}
function renderBgMenu() {
  const g = $('#bgGrid'); g.textContent = '';
  for (const [k, v] of Object.entries(BGS)) {
    g.append(h('button', { type: 'button', class: k === board().bg ? 'on' : '', onclick: () => { board().bg = k; save(); renderBoard(); } }, h('i', { style: `background:${v.c}` }), v.label));
  }
}
function switchBoard(id) { saveNow(); store.activeBoardId = id; save(); renderBoard(); }

/* ============================================================
   Top bar actions
   ============================================================ */
function closeMenus() { document.querySelectorAll('.menu.open').forEach(m => m.classList.remove('open')); document.querySelectorAll('[data-menu]').forEach(b => b.setAttribute('aria-expanded', 'false')); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-menu]');
  if (t) {
    const m = document.getElementById(t.dataset.menu); const open = !m.classList.contains('open');
    closeMenus(); if (open) { m.classList.add('open'); t.setAttribute('aria-expanded', 'true'); }
    return;
  }
  if (!e.target.closest('.menu')) closeMenus();
  const a = e.target.closest('[data-act]'); if (!a) return;
  closeMenus();
  ACTIONS[a.dataset.act] && ACTIONS[a.dataset.act]();
});
const ACTIONS = {
  async newBoard() {
    const name = await promptBox('New board', 'Board name (e.g. 3E2 SS, Form period, Assembly)'); if (!name) return;
    const b = newBoard(name); b.bg = board().bg; store.boards.push(b); switchBoard(b.id);
  },
  async renameBoard() {
    const b = board(); const name = await promptBox('Rename board', 'Board name', b.name); if (!name) return;
    b.name = name; save(); renderBoardSelect(); document.title = name + ' · CRToolbox';
  },
  dupBoard() {
    const b = board(); const copy = JSON.parse(JSON.stringify(b));
    copy.id = uid(); copy.name = ('Copy of ' + b.name).slice(0, 60);
    copy.widgets.forEach(w => { w.id = uid(); if (w.data && 'running' in w.data) { tPause(w.data); } });
    store.boards.splice(store.boards.indexOf(b) + 1, 0, copy); switchBoard(copy.id); toast('Board duplicated');
  },
  async clearBoard() {
    const b = board(); if (!b.widgets.length) return;
    if (!(await confirmBox('Remove all apps?', `Remove all ${b.widgets.length} apps from “${b.name}”?`, 'Remove all', true))) return;
    const old = b.widgets; b.widgets = []; save(); renderBoard();
    toast('All apps removed', { label: 'Undo', fn: () => { b.widgets = old; save(); if (board() === b) renderBoard(); } });
  },
  async deleteBoard() {
    const b = board();
    if (!(await confirmBox('Delete board?', `Delete “${b.name}” and everything on it? Class lists are kept.`, 'Delete board', true))) return;
    const idx = store.boards.indexOf(b); store.boards.splice(idx, 1);
    if (!store.boards.length) store.boards.push(newBoard('My board'));
    switchBoard(store.boards[Math.max(0, idx - 1)].id);
    toast(`Deleted “${b.name}”`, { label: 'Undo', fn: () => { store.boards.splice(idx, 0, b); switchBoard(b.id); } });
  },
  classes() { openClassManager(); },
  export() {
    saveNow();
    const data = Object.assign({}, store, { exportedAt: new Date().toISOString() });
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = h('a', { href: URL.createObjectURL(blob), download: `crtoolbox-backup-${new Date().toISOString().slice(0, 10)}.json` });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Backup file downloaded — keep it somewhere safe');
  },
  import() { $('#importInput').click(); },
  hideHeader() { setHeader(true); toast('Header hidden — use “Show header” at the top to bring it back'); },
  focus() { setFocus(true); },
  fullscreen() {
    if (document.fullscreenElement) document.exitFullscreen && document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => toast('Full screen is not available here'));
  },
};
$('#boardSelect').addEventListener('change', e => switchBoard(e.target.value));
$('#importInput').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  let data;
  try {
    const parsed = JSON.parse(await f.text());
    if (!parsed || !['classroom-screen', 'crtoolbox'].includes(parsed.app)) throw new Error('wrong file');
    data = normalize(parsed);
  } catch (err) { toast("That file isn't a CRToolbox backup"); return; }
  const ok = await confirmBox('Replace everything?',
    `This replaces ALL boards and class lists in this browser with the ${data.boards.length} board${data.boards.length === 1 ? '' : 's'} and ${data.classes.length} class list${data.classes.length === 1 ? '' : 's'} in “${f.name}”. Anything not in that file will be lost.`,
    'Replace all', true);
  if (!ok) return;
  store = data; saveNow(); document.body.classList.toggle('no-header', !!store.prefs.headerHidden); renderDock(); renderBoard(); toast('Backup imported');
});
document.addEventListener('fullscreenchange', () => { $('#fsBtn').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; });

function setFocus(on) {
  document.body.classList.toggle('focus', on);
  if (on) toast('Focus mode — press Esc or “Show tools” to bring the toolbars back');
}
$('#exitFocus').addEventListener('click', () => setFocus(false));
$('#showHeader').addEventListener('click', () => setHeader(false));
function setHeader(hidden) { store.prefs.headerHidden = hidden; document.body.classList.toggle('no-header', hidden); save(); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.body.classList.contains('focus') && !$('#modalRoot').children.length) setFocus(false);
  if (e.key === 'Escape') closeMenus();
});

/* Dock (two tabs) */
const DOCK = {
  tools: ['analog', 'digital', 'clock', 'notice', 'agenda', 'bubble', 'traffic', 'picker', 'groups', 'points'],
  routines: ['routine', 'talk', 'frayer', 'vote', 'confidence', 'exit'],
};
function renderDock() {

  document.querySelectorAll('#dockTabs button').forEach(b => { const on = b.dataset.tab === tab; b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on)); });
  const apps = $('#dockApps'); apps.textContent = '';
  DOCK[tab].forEach(t => {
    const app = APPS[t];
    apps.append(h('button', { type: 'button', title: 'Add ' + app.label, onclick: () => addWidget(t) }, icon(app.icon), h('span', { text: app.label })));
  });
}
$('#dockTabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  store.prefs.dockTab = b.dataset.tab; save(); renderDock();
});
$('#brandIcon').innerHTML = pixelSVG();
$('#pullIcon').innerHTML = pixelSVG();
document.head.append(h('link', { rel: 'icon', type: 'image/svg+xml', href: 'data:image/svg+xml,' + encodeURIComponent(pixelSVG()) }));
$('#classesBtn').prepend(icon('people'));

/* Global tick for timers & clocks */
setInterval(() => {
  const now = Date.now();
  for (const [, rec] of instances) { if (rec.inst.tick) { try { rec.inst.tick(now); } catch (e) { console.error(e); } } }
}, 100);

/* Boot */
store = loadStore();
if (!store.prefs) store.prefs = { dockTab: 'tools', headerHidden: false };
document.body.classList.toggle('no-header', !!store.prefs.headerHidden);
renderDock();
renderBoard();
saveNow();
})();
