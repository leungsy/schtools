<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRToolbox</title>
<style>
/* ============================================================
   CRToolbox — single-file classroom screen, works offline.
   Font: Verdana-led sans-serif stack (BDA-recommended, preinstalled on Windows).
   ============================================================ */
:root{
  --font: Verdana, Tahoma, "Segoe UI", "DejaVu Sans", Arial, sans-serif;
  --ink:#1f2a2e; --ink-2:#4a5759; --ink-3:#7b8789;
  --line:#e3ded3; --line-2:#d3cdc0;
  --card:#ffffff; --paper:#fbfaf6;
  --accent:#2f6f73; --accent-ink:#ffffff; --accent-soft:#e2eeee;
  --danger:#a5463b; --danger-soft:#f6e4e1;
  --board:#f6f1e7;
  --shadow:0 1px 2px rgba(31,42,46,.06),0 10px 28px rgba(31,42,46,.09);
  --radius:18px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font); font-size:18px; line-height:1.45; color:var(--ink);
  background:var(--board);
  display:grid; grid-template-rows:auto 1fr auto; grid-template-columns:minmax(0,1fr); overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.icon{display:inline-flex;width:1.15em;height:1.15em;flex:none}
.icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spacer{flex:1}
.muted{color:var(--ink-3)}

/* ---------- Buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:44px;padding:8px 16px;
  border-radius:12px;border:1px solid var(--line-2);background:#fff;font-size:18px;line-height:1.1;white-space:nowrap;
  transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:#f4f1ea}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#285f63}
.btn.danger{color:var(--danger);border-color:#e0bdb7}
.btn.danger:hover{background:var(--danger-soft)}
.btn.small{min-height:38px;padding:6px 12px;font-size:16px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;
  border:1px solid var(--line-2);background:#fff;padding:0;font-size:18px}
.ib:hover{background:#f4f1ea}
.ib .icon{width:22px;height:22px}
.ib.on{background:var(--accent-soft);border-color:#b9d4d4;color:var(--accent)}
.input{border:1px solid var(--line-2);border-radius:10px;background:#fff;padding:8px 12px;font-size:18px;min-height:44px;width:100%}
.input:focus,.btn:focus-visible,.ib:focus-visible,select:focus-visible{outline:3px solid #9cc7c9;outline-offset:1px}
textarea.input{resize:vertical;line-height:1.5}
select.input{appearance:auto}

#modalRoot{position:absolute;top:0;left:0;width:0;height:0}
/* ---------- Top bar ---------- */
.topbar{grid-row:1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:50}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-right:6px;white-space:nowrap}
.brand-px{display:inline-flex;width:40px;height:30px;flex:none}
.brand-px svg{width:100%;height:100%;display:block}
.brand-px.sm{width:24px;height:18px}
.board-pick select{min-width:200px;max-width:280px;font-size:17px;min-height:42px;padding:6px 10px;border-radius:10px;border:1px solid var(--line-2);background:#fff}
.tb-btn{display:inline-flex;align-items:center;gap:.4em;min-height:42px;padding:6px 12px;border-radius:10px;border:1px solid transparent;background:transparent;font-size:16px;white-space:nowrap}
.tb-btn:hover,.tb-btn[aria-expanded="true"]{background:#f1ede4;border-color:var(--line)}
.tb-btn .icon{width:20px;height:20px}
.save-status{font-size:16px;color:var(--ink-3);white-space:nowrap;padding:0 4px}
.save-status.err{color:var(--danger);font-weight:700}
.menu-wrap{position:relative}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:250px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:none;z-index:60}
.menu.right{left:auto;right:0}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:.6em;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:9px;font-size:17px}
.menu button:hover{background:#f4f1ea}
.menu button.danger{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.menu-note{font-size:16px;color:var(--ink-3);margin:6px 12px 8px;line-height:1.4}
.swatch-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;width:300px}
.swatch-grid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;font-size:16px;text-align:center}
.swatch-grid i{width:44px;height:30px;border-radius:8px;border:1px solid var(--line-2);display:block}
.swatch-grid button.on i{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- Board ---------- */
.board{grid-row:2;position:relative;overflow:hidden;isolation:isolate;
  background-color:var(--board);
  background-image:radial-gradient(rgba(31,42,46,.07) 1.2px,transparent 1.6px);background-size:28px 28px;
  transition:background-color .3s}
.board.dark{background-image:radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.6px)}
.empty-hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center;color:var(--ink-3);padding:24px}
.empty-hint div{max-width:560px;font-size:20px;line-height:1.6}
.empty-hint strong{color:var(--ink-2);display:block;font-size:24px;margin-bottom:6px}
.board.dark .empty-hint, .board.dark .empty-hint strong{color:#c9d2d4}

/* ---------- Dock ---------- */
.dock{grid-row:3;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 12px 10px;background:#fff;border-top:1px solid var(--line);position:relative;z-index:50}
.dock-apps{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.dock-apps button{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:88px;padding:8px 8px 6px;border:1px solid transparent;border-radius:14px;background:none;font-size:16px;color:var(--ink-2)}
.dock-apps button:hover{background:#f4f1ea;border-color:var(--line);color:var(--ink)}
.dock-apps .icon{width:30px;height:30px;color:var(--accent)}
.dock-tabs{display:flex;flex-direction:column;gap:4px;margin-right:8px;padding-right:12px;border-right:1px solid var(--line)}
.dock-tabs button{border:1px solid transparent;background:none;border-radius:10px;padding:6px 12px;font-size:16px;color:var(--ink-2);text-align:left;white-space:nowrap}
.dock-tabs button:hover{background:#f4f1ea}
.dock-tabs button.on{background:var(--accent-soft);border-color:#b9d4d4;color:var(--accent);font-weight:700}

/* ---------- Widgets ---------- */
.w{position:absolute;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  min-width:160px;min-height:120px;transition:background-color 1.6s ease, box-shadow .2s}
.w.enter{animation:wIn .22s ease-out}
@keyframes wIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.w.dragging{box-shadow:0 2px 4px rgba(31,42,46,.08),0 22px 48px rgba(31,42,46,.18);cursor:grabbing}
.w-head{display:flex;align-items:center;gap:6px;height:40px;flex:none;padding:0 6px 0 14px;cursor:grab;touch-action:none;user-select:none;border-radius:var(--radius) var(--radius) 0 0}
.w-title{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--ink-3);flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.w-title .icon{width:18px;height:18px;color:var(--ink-3)}
.w-actions{display:flex;gap:2px}
.w-actions button{width:34px;height:34px;border-radius:9px;border:0;background:none;display:grid;place-items:center;color:var(--ink-3);padding:0}
.w-actions button:hover{background:rgba(31,42,46,.07);color:var(--ink)}
.w-actions .icon{width:19px;height:19px}
.w-body{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;container-type:size}
.w-resize{position:absolute;right:2px;bottom:2px;width:26px;height:26px;cursor:nwse-resize;touch-action:none;z-index:3;border-radius:0 0 var(--radius) 0;
  background:linear-gradient(135deg,transparent 0 55%,rgba(31,42,46,.22) 55% 60%,transparent 60% 70%,rgba(31,42,46,.22) 70% 75%,transparent 75%)}
/* bare widgets float on the board; header appears on hover */
.w.bare{background:transparent;border-color:transparent;box-shadow:none}
.w.bare .w-head{position:absolute;left:0;right:0;top:0;z-index:4;background:rgba(255,255,255,.94);border:1px solid var(--line);opacity:0;transition:opacity .15s}
.w.bare:hover .w-head,.w.bare.dragging .w-head{opacity:1}
.w.bare .w-resize{opacity:0}
.w.bare:hover .w-resize{opacity:1}

/* Focus mode hides all editing chrome */
body.focus{grid-template-rows:0 1fr 0}
body.focus .topbar,body.focus .dock{display:none}
body.focus .w-head,body.focus .w-resize,body.focus .edit-only{display:none!important}
.exit-focus{position:fixed;right:14px;bottom:14px;z-index:70;display:none;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line-2);background:#fff;font-size:16px;opacity:.35;transition:opacity .2s}
.exit-focus:hover,.exit-focus:focus-visible{opacity:1}
body.focus .exit-focus{display:inline-flex}

/* ---------- Timer controls (shared) ---------- */
.tc{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:8px 12px 14px;flex:none}
.tc .btn.go{min-width:128px}
.tc .ib.mute{color:var(--ink-3)}
.tc .short{display:none}
@container (max-width: 430px){
  .tc{gap:6px;padding:6px 8px 10px}
  .tc .btn{font-size:16px;padding:6px 10px;min-height:40px}
  .tc .btn.go{min-width:0;padding:6px 12px}
  .tc .ib{width:40px;height:40px}
  .tc .full{display:none}.tc .short{display:inline}
}

/* ---------- Visual (analog) timer ---------- */
.at-face{flex:1;min-height:0;position:relative;cursor:pointer;margin:6px 12px 4px}
.at-face svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.at-face text{font-family:var(--font);fill:var(--ink-2);font-size:11.5px;text-anchor:middle;dominant-baseline:central}
.at-digits{flex:none;text-align:center;font-size:clamp(18px,7cqw,44px);font-weight:700;color:var(--ink-2);line-height:1.2;padding-top:2px}
.at-ring{stroke:var(--line-2);stroke-width:2;fill:#fff}
.done .at-ring{animation:ringPulse 2.4s ease-in-out infinite}
@keyframes ringPulse{0%,100%{stroke:var(--line-2);stroke-width:2}50%{stroke:var(--disc);stroke-width:5}}
.done .at-digits{color:var(--disc)}

/* ---------- Digital countdown ---------- */
.dc-main{flex:1;min-height:0;container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:color 1.6s ease}
.dc-time{font-size:min(calc(90cqw / var(--n,3)),70cqh);font-weight:700;line-height:1;letter-spacing:0;white-space:nowrap}
.dc-msg{font-size:max(16px,min(7cqw,14cqh));font-weight:700;margin-top:.25em;min-height:1.2em}
.dc-bar{height:8px;margin:0 18px;border-radius:99px;background:rgba(31,42,46,.08);overflow:hidden;flex:none}
.dc-bar i{display:block;height:100%;width:100%;border-radius:99px;background:var(--accent);transform-origin:left;transition:background-color 1.6s ease}
.w.cue-green{background:#e8f1e5}.w.cue-green .dc-main{color:#2b5836}.w.cue-green .dc-bar i{background:#80ad85}
.w.cue-amber{background:#f8eed7}.w.cue-amber .dc-main{color:#74510f}.w.cue-amber .dc-bar i{background:#d8ae5f}
.w.cue-red{background:#f6e3de}.w.cue-red .dc-main{color:#86392f}.w.cue-red .dc-bar i{background:#cf8a7e}
.done .dc-time{animation:softBlink 2.4s ease-in-out infinite}
@keyframes softBlink{0%,100%{opacity:1}50%{opacity:.45}}

/* Fixed-width digits so numbers don't jiggle */
.dg{display:inline-block;width:.64em;text-align:center}
.cl{display:inline-block;width:.36em;text-align:center;position:relative;top:-.06em}
.ap{font-size:.34em;font-weight:700;margin-left:.25em;vertical-align:.95em}

/* ---------- Notice ---------- */
.nt{display:flex;flex-direction:column;height:100%}
.nt-tools{display:none;flex-wrap:wrap;align-items:center;gap:4px;padding:6px 10px;border-bottom:1px solid var(--line);flex:none}
.w-notice:focus-within .nt-tools{display:flex}
.nt-b{min-width:40px;height:40px;border:1px solid transparent;border-radius:9px;background:none;font-size:18px;display:inline-grid;place-items:center;padding:0 6px}
.nt-b:hover{background:#f1ede4;border-color:var(--line)}
.nt-b .icon{width:22px;height:22px}
.nt-sep{width:1px;height:26px;background:var(--line);margin:0 4px}
.dot{width:20px;height:20px;border-radius:50%;display:block}
.nt-edit{flex:1;min-height:0;overflow:auto;padding:10px 22px 16px;outline:none;font-size:var(--fs);line-height:1.45;overflow-wrap:break-word}
.nt-edit:empty::before{content:attr(data-ph);color:var(--ink-3)}
.nt-edit ul,.nt-edit ol{margin:.2em 0;padding-left:1.4em}
.nt-edit li{margin:.15em 0}
.nt-edit p{margin:0}

/* ---------- Agenda ---------- */
.ag{display:flex;flex-direction:column;height:100%;padding:2px 20px 10px;font-size:var(--fs)}
.ag-title{font-weight:700;font-size:1.05em;margin:0 0 .35em;outline:none;line-height:1.3}
.ag-title:empty::before,.ag-text:empty::before{content:attr(data-ph);color:var(--ink-3);font-weight:400}
.ag-list{list-style:none;margin:0;padding:0;overflow:auto;flex:1;min-height:0}
.ag-item{display:flex;align-items:flex-start;gap:.55em;padding:.28em 0;position:relative}
.ag-check{flex:none;width:1.15em;height:1.15em;margin-top:.12em;border:2.5px solid var(--ink-2);border-radius:.25em;background:#fff;display:grid;place-items:center;padding:0;transition:background .2s,border-color .2s}
.ag-check .icon{width:.8em;height:.8em;opacity:0;color:#fff}
.ag-check .icon svg{stroke-width:3.2}
.done .ag-check{background:var(--accent);border-color:var(--accent)}
.done .ag-check .icon{opacity:1}
.ag-text{flex:1;outline:none;line-height:1.35;min-width:2em;transition:color .2s}
.done .ag-text{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:2px}
.ag-tools{position:absolute;right:0;top:.1em;display:none;gap:4px;background:#fff;padding-left:6px}
.ag-tools .ib{width:36px;height:36px}
.ag-item:hover .ag-tools{display:flex}
.ag-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:16px;padding-top:8px;margin-top:4px;border-top:1px dashed var(--line);flex:none}
.ag-count{color:var(--ink-3);white-space:nowrap}
.size-btns{display:inline-flex;gap:4px}
.size-btns .ib{width:40px;height:38px;font-size:16px;font-weight:700}

/* ---------- Speech bubble ---------- */
.bb-wrap{position:relative;flex:1;min-height:0;container-type:size}
.bb{position:absolute;left:8px;right:8px;top:8px;bottom:36px;background:var(--bb);border:3px solid var(--bbb);border-radius:34px;display:flex;align-items:center;justify-content:center;padding:4% 7%;box-shadow:0 6px 18px rgba(31,42,46,.10)}
.bb-text{font-size:max(16px,calc(var(--k,1) * 12cqmin));font-weight:700;text-align:center;line-height:1.2;outline:none;max-height:100%;overflow:hidden;overflow-wrap:anywhere;min-width:1em}
.bb-text:empty::before{content:attr(data-ph);color:var(--ink-3)}
.bb-tail{position:absolute;left:16%;bottom:8px;width:42px;height:31px;background:var(--bbb);clip-path:polygon(0 0,100% 0,16% 100%)}
.bb-tail i{position:absolute;left:4px;top:-4px;width:30px;height:28px;background:var(--bb);clip-path:polygon(0 0,100% 0,16% 100%)}

/* ---------- Traffic light ---------- */
.tl{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:14px;padding:8px;container-type:size}
.tl-house{flex:none;height:min(100cqh,100cqw * 2.4);aspect-ratio:10/24;background:#2b3336;border-radius:30px;display:grid;grid-template-rows:repeat(3,1fr);place-items:center;padding:0;box-shadow:inset 0 2px 0 rgba(255,255,255,.08),0 8px 20px rgba(31,42,46,.18)}
.tl.with-labels .tl-house{height:min(100cqh,40cqw * 2.4)}
.tl-lamp{width:64%;aspect-ratio:1;border-radius:50%;border:0;padding:0;box-shadow:inset 0 -4px 10px rgba(0,0,0,.35);transition:background-color .35s,box-shadow .35s}
.tl-red{background:#4f302d}.tl-amber{background:#50432a}.tl-green{background:#2c4535}
.tl-red.on{background:#e3604f;box-shadow:inset 0 -4px 10px rgba(0,0,0,.15),0 0 0 4px rgba(227,96,79,.22),0 0 26px rgba(227,96,79,.5)}
.tl-amber.on{background:#efb646;box-shadow:inset 0 -4px 10px rgba(0,0,0,.12),0 0 0 4px rgba(239,182,70,.22),0 0 26px rgba(239,182,70,.5)}
.tl-green.on{background:#4fb97c;box-shadow:inset 0 -4px 10px rgba(0,0,0,.12),0 0 0 4px rgba(79,185,124,.22),0 0 26px rgba(79,185,124,.5)}
.tl-labels{flex:1;min-width:0;height:min(100cqh,40cqw * 2.4);display:grid;grid-template-rows:repeat(3,1fr);align-items:center}
.tl-label{display:inline-block;max-width:100%;font-size:clamp(16px,6.5cqw,40px);padding:.3em .65em;border-radius:12px;background:rgba(255,255,255,.92);border:1px solid var(--line);color:var(--ink-3);outline:none;overflow-wrap:anywhere;transition:color .3s,border-color .3s}
.tl-lrow.on .tl-label{color:var(--ink);font-weight:700;border-color:var(--lc);box-shadow:inset 6px 0 0 var(--lc)}
.tl-lrow:nth-child(1){--lc:#e3604f}.tl-lrow:nth-child(2){--lc:#efb646}.tl-lrow:nth-child(3){--lc:#4fb97c}

/* ---------- Name picker ---------- */
.pk{display:flex;flex-direction:column;height:100%;padding:0 16px 12px;gap:8px}
.pk-top{display:flex;gap:8px;align-items:center;flex:none}
.pk-top select{flex:1;min-width:0}
.pk-stage{flex:1;min-height:0;container-type:size;display:grid;place-items:center;text-align:center;border-radius:14px;background:var(--paper);border:1px solid var(--line)}
.pk-name{font-size:min(13cqw,42cqh);font-weight:700;line-height:1.12;overflow-wrap:anywhere;padding:0 4%}
.pk-name.idle{font-size:max(16px,min(6cqw,18cqh));font-weight:400;color:var(--ink-3)}
.pk-name.rolling{color:var(--ink-3)}
.pk-name.landed{animation:land .35s ease-out}
@keyframes land{from{transform:scale(.92);opacity:.6}to{transform:none;opacity:1}}
.pk-bottom{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:none}
.pk-bottom .btn.primary{flex:1;min-width:150px}
.linkbtn{border:0;background:none;padding:4px 2px;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:16px}

/* switch */
.switch{display:inline-flex;align-items:center;gap:10px;font-size:16px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:46px;height:26px;border-radius:99px;background:#cfc9bd;position:relative;flex:none;transition:background .2s}
.switch .track::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(20px)}
.switch input:focus-visible + .track{outline:3px solid #9cc7c9;outline-offset:2px}

/* ---------- Clock ---------- */
.ck{flex:1;min-height:0;container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 10px 10px}
.ck-time{font-size:min(calc(90cqw / var(--n,3)),60cqh);font-weight:700;line-height:1;white-space:nowrap}
.ck-date{font-size:max(16px,min(6cqw,13cqh));color:var(--ink-2);margin-top:.45em;text-align:center}

/* ---------- Group points ---------- */
.pt{display:flex;flex-direction:column;height:100%;padding:0 12px 10px;gap:8px}
.pt-grid{flex:1;min-height:0;display:grid;gap:10px}
.pt-card{container-type:size;position:relative;border-radius:14px;background:var(--paper);border:1px solid var(--line);border-top:7px solid var(--gc);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.pt-card.lead{border-color:var(--gc);box-shadow:0 0 0 2px var(--gc) inset}
.pt-top{display:flex;align-items:center;justify-content:center;gap:.3em;padding:4% 6% 0;flex:none;font-size:clamp(16px,min(11cqw,16cqh),34px)}
.pt-name{font-weight:700;outline:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:1em;color:var(--ink)}
.pt-star{color:#c79a1e;flex:none}
.pt-main{flex:1;min-height:0;display:flex;align-items:center;justify-content:space-between;gap:2%;padding:0 5% 3%}
.pt-score{flex:1;text-align:center;font-weight:700;font-size:min(36cqw,52cqh);line-height:1;font-variant-numeric:tabular-nums}
.pt-btn{flex:none;width:clamp(40px,min(22cqw,30cqh),76px);aspect-ratio:1;border-radius:50%;border:1px solid var(--line-2);background:#fff;display:grid;place-items:center;padding:0}
.pt-btn:hover{background:#f4f1ea}
.pt-btn .icon{width:52%;height:52%}
.pt-btn .icon svg{stroke-width:2.6}
.pt-btn.plus{color:#2b6b45}.pt-btn.minus{color:#8a4a3f}
.pt-card.up .pt-score{animation:bumpUp .45s ease-out}
.pt-card.down .pt-score{animation:bumpDown .45s ease-out}
@keyframes bumpUp{0%{transform:scale(1.18);color:#2b6b45}100%{transform:none}}
@keyframes bumpDown{0%{transform:scale(.86);color:#8a4a3f}100%{transform:none}}
.pt-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:16px;flex:none}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line-2);background:#fff;min-width:44px;height:38px;font-size:16px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(31,42,46,.38);display:grid;place-items:center;z-index:100;padding:16px;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}}
.modal{background:#fff;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.25);width:min(610px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal.wide{width:min(860px,100%)}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 16px 8px 24px}
.modal-head h2{margin:0;font-size:22px;flex:1}
.modal-head .ib{border-color:transparent}
.modal-body{padding:8px 24px 16px;overflow:auto}
.modal-body p{margin:.3em 0 .8em}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;padding:12px 24px 20px;border-top:1px solid var(--line)}
.form{display:flex;flex-direction:column;gap:18px}
.form-sec h3{margin:0 0 10px;font-size:18px}
.form-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;font-size:16px;color:var(--ink-2)}
.hms{display:flex;gap:14px;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper .input{width:76px;text-align:center;font-size:22px;font-weight:700;padding:6px 4px}
.stepper .ib{width:42px;height:42px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--line-2);background:#fff;border-radius:99px;padding:6px 14px;font-size:16px;min-height:38px}
.chip:hover{background:var(--accent-soft);border-color:#b9d4d4}
.check{display:flex;align-items:flex-start;gap:12px;font-size:17px;cursor:pointer;line-height:1.4}
.check input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.radios{display:flex;flex-direction:column;gap:8px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line-2);padding:0}
.swatches button.on{box-shadow:0 0 0 3px var(--accent)}
.cue-preview{display:flex;gap:8px;margin-top:10px}
.cue-preview span{padding:6px 14px;border-radius:10px;font-size:16px;font-weight:700}
.form-err{color:var(--danger);font-weight:700;margin:0;min-height:1em}
.note{font-size:16px;color:var(--ink-2);min-height:1.4em;margin-top:8px}

/* class manager */
.cm{display:grid;grid-template-columns:220px 1fr;gap:20px;min-height:380px}
.cm-list{display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);padding-right:14px;overflow:auto;max-height:60vh}
.cm-item{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid transparent;background:none;border-radius:10px;padding:10px 12px;text-align:left;font-size:17px}
.cm-item small{color:var(--ink-3);font-size:16px}
.cm-item:hover{background:#f4f1ea}
.cm-item.on{background:var(--accent-soft);border-color:#b9d4d4}
.cm-new{color:var(--accent);font-weight:700}
.cm-edit{display:flex;flex-direction:column;gap:12px;min-width:0}
.cm-names{min-height:240px;font-size:18px}
.cm-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.left-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.left-cols h3{font-size:18px;margin:0 0 8px}
.left-cols ul{margin:0;padding-left:1.2em;max-height:50vh;overflow:auto}

/* toast */
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:#1f2a2e;color:#fff;border-radius:14px;padding:12px 16px 12px 20px;display:flex;align-items:center;gap:14px;font-size:17px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:120;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.toast button{border:1px solid rgba(255,255,255,.4);background:none;color:#fff;border-radius:9px;padding:6px 12px;font-size:16px}
body.focus .toast{bottom:24px}


/* ---------- Header hide ---------- */
.pull-tab{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:70;display:none;align-items:center;gap:8px;padding:4px 14px 6px;border:1px solid var(--line-2);border-top:0;border-radius:0 0 12px 12px;background:#fff;font-size:16px;opacity:.6;transition:opacity .2s}
.pull-tab:hover,.pull-tab:focus-visible{opacity:1}
body.no-header .topbar{display:none}
body.no-header .pull-tab{display:inline-flex}
body.focus .pull-tab{display:none!important}

.ib:disabled,.ib[disabled]{opacity:.4;cursor:not-allowed}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg button{padding:0 12px}
.stepper.compact .input{width:62px;font-size:18px;min-height:40px}
.stepper.compact .ib{width:38px;height:40px}

/* ---------- Sentence starters (shared) ---------- */
.st-cat{margin-bottom:.7em}
.st-cat h4{margin:0 0 .3em;font-size:max(16px,.78em);color:var(--cc,var(--accent))}
.st-cat ul{margin:0;padding:0;list-style:none}
.st-cat li{padding:.3em .55em;margin:.22em 0;border-left:5px solid var(--cc,var(--accent));background:#fff;border-radius:0 9px 9px 0;line-height:1.35}
.blank{display:inline-block;min-width:2.2em;height:1em;border-bottom:2px dotted var(--ink-3);margin:0 .12em;vertical-align:-.15em}

/* ---------- Routine card ---------- */
.rt{display:flex;flex-direction:column;height:100%;padding:0 18px 12px;gap:10px;font-size:var(--fs)}
.rt-top{display:flex;align-items:flex-start;gap:10px;flex:none}
.rt-top select{width:auto;max-width:42%;font-size:16px;min-height:40px;padding:4px 8px}
.rt-focus{flex:1;min-width:0;background:var(--accent-soft);border-radius:12px;padding:6px 14px 8px}
.rt-focus small{display:block;font-size:16px;color:var(--accent);font-weight:700}
.rt-focus-t{font-weight:700;outline:none;line-height:1.3}
.rt-focus-t:empty::before{content:attr(data-ph);color:var(--ink-3);font-weight:400;font-size:max(16px,.75em)}
.rt-main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.rt-main.solo{grid-template-columns:minmax(0,1fr)}
@container (max-width: 660px){ .rt-main{grid-template-columns:minmax(0,1fr);grid-auto-rows:auto;overflow:auto} .rt-step,.rt-st{overflow:visible} }
.rt-step{min-height:0;overflow:auto}
.rt-count{font-size:16px;color:var(--ink-3);font-weight:700}
.rt-title{font-size:1.45em;font-weight:700;line-height:1.2;margin:.15em 0 .35em}
.rt-text p{margin:.25em 0}
.rt-text ul{margin:.2em 0 .35em;padding-left:1.3em}
.rt-text li{margin:.2em 0}
.rt-st{min-height:0;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:.86em}
.rt-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:none;font-size:16px}
.rt-dots{display:flex;gap:6px;flex-wrap:wrap}
.rt-dots button{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);background:#fff;padding:0}
.rt-dots button.past{background:#b9d4d4;border-color:#b9d4d4}
.rt-dots button.on{background:var(--accent);border-color:var(--accent)}
.rt-timer{display:inline-flex;align-items:center;gap:8px;padding:3px 4px 3px 12px;border:1px solid var(--line-2);border-radius:12px;background:#fff;transition:background-color 1s}
.rt-timer .icon{color:var(--ink-3)}
.rt-timer .ib{width:38px;height:38px}
.rt-time{font-weight:700;font-size:22px;min-width:3.1em;text-align:center}
.rt-timer.done{border-color:#cf8a7e;background:#f6e3de}
.rt-timer.done .rt-time{color:#86392f;animation:softBlink 2.4s ease-in-out infinite}
.se-list{display:flex;flex-direction:column;gap:14px}
.se-item{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.se-head{display:flex;align-items:center;gap:8px}
.se-head .ib{width:38px;height:38px}
.se-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}

/* ---------- Sentence starters app ---------- */
.tk{flex:1;min-height:0;overflow:auto;padding:0 16px 8px;font-size:var(--fs)}
.tk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;align-items:start}
.tk .st-cat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:0}
.tk-foot{flex:none;display:flex;justify-content:flex-end;gap:8px;padding:0 16px 10px}

/* ---------- Frayer model ---------- */
.fr{display:flex;flex-direction:column;height:100%;padding:0 14px 10px;gap:8px;font-size:var(--fs)}
.fr-grid{flex:1;min-height:0;position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:10px}
.fr-q{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-top:6px solid var(--qc);border-radius:14px;padding:8px 14px;overflow:hidden}
.fr-q.top{padding-bottom:calc(var(--th,0px) / 2 + 6px)}
.fr-q.bot{padding-top:calc(var(--th,0px) / 2 + 6px)}
.fr-h{font-weight:700;font-size:max(16px,.82em);color:var(--qc);outline:none;flex:none}
.fr-c{flex:1;min-height:0;overflow:auto;outline:none;line-height:1.35}
.fr-c ul,.ex-r ul{margin:.15em 0;padding-left:1.2em}
.fr-c li,.ex-r li{margin:.15em 0}
.fr-term{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;max-width:48%;min-width:5em;text-align:center;font-weight:700;font-size:1.35em;background:#fff;border:3px solid var(--accent);border-radius:999px;padding:.35em 1.1em;outline:none;box-shadow:0 4px 14px rgba(31,42,46,.12);line-height:1.2;overflow-wrap:anywhere}
.fr-term:empty::before{content:attr(data-ph);color:var(--ink-3);font-weight:400}
.fr-foot{display:flex;gap:8px;align-items:center;font-size:16px;flex:none}

/* ---------- Voting tracker ---------- */
.vt{display:flex;flex-direction:column;height:100%;padding:0 16px 12px;gap:10px;outline:none}
.vt-nav{display:flex;align-items:center;gap:8px;flex:none;font-size:16px}
.vt-nav .ib{width:40px;height:40px}
.vt-n{font-weight:700;color:var(--ink-2);min-width:8.5em;text-align:center}
.vt-q{font-size:max(18px,min(5cqw,9cqh));font-weight:700;line-height:1.25;outline:none;flex:none}
.vt-q:empty::before,.cf-s:empty::before{content:attr(data-ph);color:var(--ink-3);font-weight:400}
.vt-rows{flex:1;min-height:0;display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:8px}
.vt-row{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:center;gap:12px;min-height:0}
.vt-lab{font-weight:700;font-size:max(16px,min(4cqw,7cqh));min-width:4.3em}
.vt-in{display:flex;align-items:center;gap:4px}
.vt-in .input{width:70px;text-align:center;font-weight:700;font-size:20px;padding:4px;min-height:40px}
.vt-in .ib{width:38px;height:40px}
.vt-track{position:relative;height:100%;max-height:76px;min-height:38px;background:rgba(31,42,46,.06);border-radius:12px;overflow:hidden}
.vt-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--vc);border-radius:12px;transition:width .5s ease}
.vt-val{position:absolute;inset:0;display:flex;align-items:center;gap:.5em;padding:0 14px;font-size:max(16px,min(4cqw,7cqh));color:var(--ink);white-space:nowrap}
.vt-cnt{font-size:max(16px,.7em);color:var(--ink-2)}
.vt-foot,.cf-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:none;font-size:16px}
.hidden-res .vt-in .input:not(:focus),.hidden-res .cf-in .input:not(:focus){color:transparent;text-shadow:0 0 9px rgba(31,42,46,.6)}
.vt-hidden{position:absolute;inset:0;display:flex;align-items:center;padding:0 14px;color:var(--ink-3);font-size:16px}

/* ---------- Fist to five ---------- */
.cf{display:flex;flex-direction:column;height:100%;padding:0 16px 12px;gap:8px}
.cf-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:none}
.cf-s{flex:1;min-width:10em;font-size:max(18px,min(4.4cqw,8cqh));font-weight:700;outline:none;line-height:1.25}
.cf-chart{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.cf-col{display:flex;flex-direction:column;align-items:center;min-height:0;min-width:0}
.cf-bars{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px;border-bottom:2px solid var(--line-2);padding-top:26px}
.cf-bar{width:38%;max-width:44px;border-radius:8px 8px 0 0;position:relative;transition:height .5s ease}
.cf-bar.s{background:#b9d4d4}.cf-bar.e{background:var(--accent)}
.cf-bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:16px;font-weight:700;white-space:nowrap;padding-bottom:2px;color:var(--ink)}
.cf-x{flex:none;font-weight:700;font-size:22px;margin-top:4px;line-height:1.1}
.cf-xl{flex:none;font-size:16px;color:var(--ink-3);text-align:center;line-height:1.2;min-height:2.5em;padding-bottom:4px}
.cf-in{flex:none;display:flex;gap:2px;align-items:center}
.cf-in .input{width:48px;text-align:center;font-weight:700;padding:4px 2px;min-height:38px}
.cf-in .ib{width:32px;height:38px}
.cf-legend{white-space:nowrap}
.cf-legend i{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:-3px;margin-right:6px}

/* ---------- Exit ticket ---------- */
.ex{display:flex;flex-direction:column;height:100%;padding:0 18px 12px;gap:10px;font-size:var(--fs)}
.ex-head{display:flex;align-items:baseline;gap:.6em;flex-wrap:wrap;flex:none}
.ex-head b{font-size:1.1em}
.ex-topic{flex:1;min-width:6em;outline:none;color:var(--ink-2)}
.ex-topic:empty::before{content:attr(data-ph);color:var(--ink-3);font-size:max(16px,.75em)}
.ex-321{flex:1;min-height:0;display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:10px;overflow:auto}
.ex-321.resp{grid-template-rows:repeat(3,minmax(0,1fr));align-content:stretch}
.ex-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-height:0}
.ex-321.resp .ex-row{align-items:start;grid-template-rows:auto minmax(0,1fr)}
.ex-badge{width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.2em;color:#fff;background:var(--bc)}
.ex-321.resp .ex-badge{grid-row:span 2}
.ex-p{font-weight:700;outline:none;line-height:1.3}
.ex-r{outline:none;min-height:1.4em;overflow:auto;line-height:1.35;border-top:1px dashed var(--line-2);padding-top:4px}
.ex-bn{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px}
.ex-col{display:flex;flex-direction:column;gap:8px;background:var(--paper);border:1px solid var(--line);border-top:6px solid var(--bc);border-radius:14px;padding:12px 16px;min-height:0}
.ex-col .ex-r{flex:1}
.ex-arrow{align-self:center;color:var(--ink-3)}
.ex-arrow .icon{width:1.4em;height:1.4em}
.ex-foot{display:flex;gap:8px;align-items:center;flex:none;font-size:16px}

/* ---------- Group maker ---------- */
.gm{display:flex;flex-direction:column;height:100%;padding:0 14px 12px;gap:8px}
.gm-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:none}
.gm-top select{width:auto;flex:1;min-width:150px}
.gm-grid{flex:1;min-height:0;display:grid;gap:10px}
.gm-card{container-type:size;min-width:0;min-height:0;border-radius:14px;background:var(--paper);border:1px solid var(--line);border-top:6px solid var(--gc);display:flex;flex-direction:column;padding:6px 12px;overflow:hidden}
.gm-card h4{margin:0;font-size:clamp(16px,min(9cqw,13cqh),26px);color:var(--ink-2);flex:none}
.gm-card ul{list-style:none;margin:0;padding:0;font-size:clamp(16px,min(10cqw,calc(78cqh / (var(--k) + 1.6))),34px);line-height:1.25;font-weight:700}
.gm-card li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm-ab{display:inline-block;min-width:1.5em;text-align:center;font-size:max(16px,.68em);border-radius:6px;margin-right:.35em;padding:0 .25em;vertical-align:.08em}
.gm-ab.a{background:#dbe8fb;color:#2c4f8c}.gm-ab.b{background:#f8e0d6;color:#8a4a2c}
.gm-empty{display:grid;place-items:center;text-align:center;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:14px;padding:16px;font-size:18px}
.gm-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:16px;flex:none}
.abs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px 16px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (max-width:760px){
  .cm{grid-template-columns:1fr}
  .cm-list{border-right:0;border-bottom:1px solid var(--line);padding:0 0 10px;max-height:160px}
  .brand span{display:none}
}
</style>
</head>
<body>

<header class="topbar" id="topbar">
  <div class="brand"><span class="brand-px" id="brandIcon" aria-hidden="true"></span><span>CRToolbox</span></div>
  <label class="board-pick"><span class="sr">Current board</span><select id="boardSelect" title="Switch board"></select></label>
  <div class="menu-wrap">
    <button class="tb-btn" data-menu="boardMenu" aria-haspopup="true" aria-expanded="false">Board ▾</button>
    <div class="menu" id="boardMenu" role="menu">
      <button data-act="newBoard">New board…</button>
      <button data-act="renameBoard">Rename this board…</button>
      <button data-act="dupBoard">Duplicate this board</button>
      <button data-act="clearBoard">Remove all apps from this board</button>
      <hr>
      <button data-act="deleteBoard" class="danger">Delete this board…</button>
    </div>
  </div>
  <div class="menu-wrap">
    <button class="tb-btn" data-menu="bgMenu" aria-haspopup="true" aria-expanded="false">Background ▾</button>
    <div class="menu" id="bgMenu"><div class="swatch-grid" id="bgGrid"></div></div>
  </div>
  <div class="spacer"></div>
  <button class="tb-btn" data-act="classes" id="classesBtn">Class lists</button>
  <div class="menu-wrap">
    <button class="tb-btn" data-menu="backupMenu" aria-haspopup="true" aria-expanded="false">Backup ▾</button>
    <div class="menu right" id="backupMenu">
      <button data-act="export">Export backup file</button>

/* fixed-width digit rendering */
function setDigits(el, s, suffix) {
  if (el._s === s + (suffix || '')) return;
  el._s = s + (suffix || '');
  el.textContent = '';
  let n = 0;
  for (const ch of s) {
    if (/\d/.test(ch)) { el.append(h('span', { class: 'dg', text: ch })); n += 0.64; }
    else if (ch === ':') { el.append(h('span', { class: 'cl', text: ':' })); n += 0.36; }
    else { el.append(ch); n += 0.6; }
  }
  if (suffix) { el.append(h('span', { class: 'ap', text: suffix })); n += 0.95; }
  el.style.setProperty('--n', n.toFixed(2));
}
function fmtMs(ms) {
  const t = Math.ceil(Math.max(0, ms) / 1000);
  const H = Math.floor(t / 3600), M = Math.floor((t % 3600) / 60), S = t % 60;
  return H > 0 ? `${H}:${pad(M)}:${pad(S)}` : `${pad(M)}:${pad(S)}`;
}
function fmtShort(ms) {
  const t = Math.round(ms / 1000);
  const H = Math.floor(t / 3600), M = Math.floor((t % 3600) / 60), S = t % 60;
  if (H > 0) return M ? `${H}h${pad(M)}` : `${H}h`;

/* ============================================================
   Sound — a soft synthesized chime (no audio files needed)
   ============================================================ */
let actx = null;
function audio() {
  try {
    if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; actx = new AC(); }
    if (actx.state === 'suspended') actx.resume();

  } catch (e) { return null; }
}
function bell(ctx, f, t, vol) {
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);
  const o1 = ctx.createOscillator(); o1.type = 'sine'; o1.frequency.value = f;
  const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2.005;
  const g2 = ctx.createGain(); g2.gain.value = 0.18;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(ctx.destination);
  o1.start(t); o2.start(t); o1.stop(t + 2.7); o2.stop(t + 2.7);
}
function chime() {
  const ctx = audio(); if (!ctx) return;
  const t0 = ctx.currentTime + 0.05;
  const notes = [659.25, 830.61, 987.77]; // E5 G#5 B5 — a gentle major arpeggio
  [0, 1.6].forEach(rep => notes.forEach((f, i) => bell(ctx, f, t0 + rep + i * 0.32, 0.16)));

document.addEventListener('pointerdown', () => { audio(); }, { once: true });

/* ============================================================
   Data store
   ============================================================ */
const BGS = {
  cream: { label: 'Cream', c: '#f6f1e7' }, white: { label: 'White', c: '#fbfbf9' },
  mist: { label: 'Mist', c: '#e8edf0' }, sage: { label: 'Sage', c: '#e4ebe0' },
  sky: { label: 'Sky', c: '#e2ecf6' }, lilac: { label: 'Lilac', c: '#ebe7f3' },
  sand: { label: 'Sand', c: '#eee3d0' }, slate: { label: 'Slate', c: '#2c3539', dark: true },
};
let store = null;
let saveTimer = null;

function newBoard(name) { return { id: uid(), name, bg: 'cream', widgets: [] }; }
function board() { return store.boards.find(b => b.id === store.activeBoardId) || store.boards[0]; }

function sampleStore() {
  const b = newBoard('My first board');
  const add = (type, x, y, w, hh, patch) => b.widgets.push({ id: uid(), type, x, y, w, h: hh, z: b.widgets.length + 1, data: Object.assign(APPS[type].defaults(), patch || {}) });
  add('bubble', 2, 3, 30, 30, { text: 'Good morning, everyone!' });
  add('clock', 34, 3, 26, 24);
  add('traffic', 78, 3, 20, 56, { on: 'red' });
  add('agenda', 2, 37, 40, 58);
  add('digital', 45, 33, 32, 40);
  return { app: 'crtoolbox', version: 2, activeBoardId: b.id, boards: [b], classes: [], prefs: { dockTab: 'tools', headerHidden: false } };
}

function dedupe(arr) {
  const seen = new Set(), out = [];
  for (const n of arr) { const k = n.toLocaleLowerCase(); if (!seen.has(k)) { seen.add(k); out.push(n); } }
  return out;
}

function normalize(s) {
  if (!s || typeof s !== 'object' || !Array.isArray(s.boards)) throw new Error('Not a backup');
  const out = { app: 'crtoolbox', version: 2, boards: [], classes: [], activeBoardId: null };
  const ids = new Set();
  const freshId = v => { let id = str(v).slice(0, 40); if (!id || ids.has(id)) id = uid(); ids.add(id); return id; };
  for (const b of s.boards) {
    if (!b || typeof b !== 'object') continue;
    const nb = { id: freshId(b.id), name: str(b.name).slice(0, 60) || 'Untitled board', bg: BGS[b.bg] ? b.bg : 'cream', widgets: [] };
    for (const w of (Array.isArray(b.widgets) ? b.widgets : [])) {
      if (!w || typeof w !== 'object' || !APPS[w.type]) continue;
      const nw = {
        id: freshId(w.id), type: w.type,
        w: clamp(numOr(w.w, 30), 5, 100), h: clamp(numOr(w.h, 30), 5, 100),
        x: 0, y: 0, z: clamp(Math.round(numOr(w.z, 1)), 1, 100000),
        data: Object.assign(APPS[w.type].defaults(), (w.data && typeof w.data === 'object') ? w.data : {}),
      };
      nw.x = clamp(numOr(w.x, 5), 0, 100 - nw.w);
      nw.y = clamp(numOr(w.y, 5), 0, 100 - nw.h);
      if (APPS[w.type].fix) APPS[w.type].fix(nw.data);
      nb.widgets.push(nw);
    }
    out.boards.push(nb);
  }
  if (!out.boards.length) out.boards.push(newBoard('My board'));
  for (const c of (Array.isArray(s.classes) ? s.classes : [])) {
    if (!c || typeof c !== 'object') continue;
    out.classes.push({
      id: freshId(c.id), name: str(c.name).slice(0, 60) || 'Class',
      names: dedupe((Array.isArray(c.names) ? c.names : []).map(n => str(n).trim().slice(0, 80)).filter(Boolean)),
    });
  }
  out.activeBoardId = out.boards.some(b => b.id === s.activeBoardId) ? s.activeBoardId : out.boards[0].id;
  const P = s.prefs && typeof s.prefs === 'object' ? s.prefs : {};
  out.prefs = { dockTab: P.dockTab === 'routines' ? 'routines' : 'tools', headerHidden: !!P.headerHidden };
  if (s.starters && typeof s.starters === 'object') {
    out.starters = {};
    for (const k of Object.keys(STARTER_CATS)) {
      const a = Array.isArray(s.starters[k]) ? s.starters[k].map(x => str(x).trim().slice(0, 200)).filter(Boolean).slice(0, 20) : [];
      out.starters[k] = a.length ? a : DEFAULT_STARTERS[k].slice();
    }
  }
  return out;
}

function loadStore() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) { /* fall through */ }

}
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 350); }
function saveNow() {
  clearTimeout(saveTimer);
  const el = $('#saveStatus');
  try {
    localStorage.setItem(KEY, JSON.stringify(store));
    el.textContent = '✓ Saved'; el.classList.remove('err');
    el.title = 'Saved automatically in this browser. Use Backup ▸ Export to keep a copy.';
  } catch (e) {
    el.textContent = 'Not saving — export a backup'; el.classList.add('err');

document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });

/* ============================================================
   Timer core (shared by Visual timer + Countdown)
   ============================================================ */
const timerDefaults = sec => ({ duration: sec * 1000, remaining: sec * 1000, running: false, endAt: 0, done: false, chime: true });
function fixTimer(d) {
  d.duration = clamp(Math.round(numOr(d.duration, 300000)), 1000, 24 * 3600000);
  d.remaining = clamp(numOr(d.remaining, d.duration), 0, 24 * 3600000);
  d.running = !!d.running; d.done = !!d.done; d.chime = d.chime !== false;
  d.endAt = numOr(d.endAt, 0);
}
function tLeft(d, now) { return d.running ? Math.max(0, d.endAt - now) : d.remaining; }
function tStart(d) { if (d.remaining <= 0 || d.done) d.remaining = d.duration; d.done = false; d.endAt = Date.now() + d.remaining; d.running = true; audio(); }
function tPause(d) { if (!d.running) return; d.remaining = Math.max(0, d.endAt - Date.now()); d.running = false; }
function tReset(d) { d.running = false; d.remaining = d.duration; d.done = false; }
function tSet(d, ms) { d.duration = ms; d.remaining = ms; d.running = false; d.done = false; }
function tAdd(d, ms) {
  if (d.done) { d.done = false; d.remaining = 0; }
  if (d.running) { d.endAt += ms; d.duration = Math.max(d.duration, d.endAt - Date.now()); }
  else { d.remaining += ms; d.duration = Math.max(d.duration, d.remaining); }
}
function tCheck(d, now) {
  if (d.running && d.endAt <= now) { d.running = false; d.remaining = 0; d.done = true; return true; }
  return false;
}

function timerControls(w, ctx, refresh) {
  const d = w.data;
  const go = h('button', { class: 'btn primary go', type: 'button' });
  go.addEventListener('click', () => { if (d.running) tPause(d); else tStart(d); ctx.save(); refresh(); sync(); });
  const reset = ib('reset', 'Reset', () => { tReset(d); ctx.save(); refresh(); sync(); });
  const plus = h('button', { class: 'btn', type: 'button', title: 'Add one minute', 'aria-label': 'Add one minute', onclick: () => { tAdd(d, 60000); ctx.save(); refresh(); sync(); } }, h('span', { class: 'full', text: '+1 min' }), h('span', { class: 'short', text: '+1' }));
  const set = h('button', { class: 'btn', type: 'button', title: 'Set the time and options', onclick: () => openTimerSettings(w, ctx) }, 'Set');
  const bellBtn = h('button', { class: 'ib', type: 'button', onclick: () => { d.chime = !d.chime; ctx.save(); sync(); toast(d.chime ? 'Chime on' : 'Chime off — this timer is silent'); } });
  function sync() {
    go.textContent = '';
    const label = d.running ? 'Pause' : d.done ? 'Restart' : (d.remaining < d.duration ? 'Resume' : 'Start');
    go.append(icon(d.running ? 'pause' : 'play'), label);
    bellBtn.textContent = ''; bellBtn.append(icon(d.chime ? 'bell' : 'bellOff'));
    bellBtn.classList.toggle('mute', !d.chime);
    bellBtn.title = d.chime ? 'Chime on — click to make silent' : 'Silent — click to turn chime on';
    bellBtn.setAttribute('aria-label', bellBtn.title);
  }
  sync();
  return { el: h('div', { class: 'tc' }, go, reset, plus, set, bellBtn), sync };
}

/* ============================================================

   ============================================================ */
function field(label, control) { return h('label', { class: 'field' }, h('span', { text: label }), control); }
function stepper(value, min, max, step = 1, onChange) {
  const input = h('input', { class: 'input', type: 'number', min, max, step, value, inputmode: 'decimal' });
  const fix = () => {
    let v = parseFloat(input.value); if (isNaN(v)) v = min;
    v = Math.round(clamp(v, min, max) / step) * step; v = +v.toFixed(2);
    input.value = v; if (onChange) onChange(v); return v;
  };
  const bump = dir => { input.value = clamp((parseFloat(input.value) || 0) + dir * step, min, max); fix(); };
  input.addEventListener('change', fix);
  input.addEventListener('focus', () => input.select());
  return {
    el: h('div', { class: 'stepper' }, ib('minus', 'Decrease', () => bump(-1)), input, ib('plus', 'Increase', () => bump(1))),
    get: fix, set: v => { input.value = v; }, input,

function openModal({ title, body, actions = [], wide = false, onClose }) {
  const root = $('#modalRoot');
  const overlay = h('div', { class: 'modal-overlay' });
  const box = h('div', { class: 'modal' + (wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': title });
  let closed = false;
  const close = () => {
    if (closed) return; closed = true;
    overlay.remove(); document.removeEventListener('keydown', onKey, true);
    if (onClose) onClose();
  };
  const onKey = e => {
    if (e.key === 'Escape' && root.lastElementChild === overlay) { e.stopPropagation(); e.preventDefault(); close(); }
  };
  box.append(
    h('div', { class: 'modal-head' }, h('h2', { text: title }), ib('close', 'Close', close)),
    h('div', { class: 'modal-body' }, body),
    actions.length ? h('div', { class: 'modal-actions' }, actions.map(a => h('button', {
      class: 'btn ' + (a.kind || ''), type: 'button',
      onclick: () => { if (a.onClick && a.onClick() === false) return; close(); },
    }, a.label))) : null
  );
  overlay.addEventListener('pointerdown', e => { if (e.target === overlay) close(); });
  overlay.append(box); root.append(overlay);
  document.addEventListener('keydown', onKey, true);
  setTimeout(() => {
    const f = box.querySelector('[data-autofocus]') || box.querySelector('.modal-actions .btn.primary');
    if (f) f.focus();
  }, 30);
  return { close, box };
}
function confirmBox(title, msg, okLabel = 'OK', danger = false) {
  return new Promise(res => {
    let answered = false;
    openModal({
      title, body: h('p', { text: msg }),
      actions: [
        { label: 'Cancel', onClick: () => { answered = true; res(false); } },
        { label: okLabel, kind: danger ? 'danger' : 'primary', onClick: () => { answered = true; res(true); } },
      ],
      onClose: () => { if (!answered) res(false); },

}

    let answered = false;

/* ============================================================
   Rich-text sanitizer for Notice
   ============================================================ */
const KEEP_TAGS = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'S', 'STRIKE', 'DEL', 'UL', 'OL', 'LI', 'BR', 'DIV', 'P', 'SPAN', 'FONT']);
const DROP_TAGS = new Set(['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'IMG', 'SVG', 'MATH', 'TEMPLATE', 'LINK', 'META', 'VIDEO', 'AUDIO', 'FORM', 'INPUT', 'BUTTON', 'TEXTAREA', 'SELECT']);
const SAFE_COLOR = /^(#[0-9a-f]{3,8}|rgba?\(\s*[\d.\s,%]+\)|[a-z]{3,20})$/i;
function sanitize(html) {
  const t = document.createElement('template');
  t.innerHTML = str(html);
  (function walk(node) {
    for (const n of [...node.childNodes]) {
      if (n.nodeType === 1) {
        if (DROP_TAGS.has(n.tagName)) { n.remove(); continue; }
        walk(n);
        if (!KEEP_TAGS.has(n.tagName)) { n.replaceWith(...n.childNodes); continue; }
        const st = n.style || {};
        const keep = {
          color: n.tagName === 'FONT' ? n.getAttribute('color') : st.color,
          fontWeight: st.fontWeight, fontStyle: st.fontStyle, textDecoration: st.textDecorationLine || st.textDecoration,
        };
        for (const a of [...n.attributes]) n.removeAttribute(a.name);
        if (keep.color && SAFE_COLOR.test(keep.color.trim())) n.style.color = keep.color.trim();
        if (keep.fontWeight && /^(bold|bolder|[5-9]00)$/.test(keep.fontWeight)) n.style.fontWeight = 'bold';
        if (keep.fontStyle === 'italic') n.style.fontStyle = 'italic';
        if (keep.textDecoration && /^(underline|line-through|underline line-through|line-through underline)$/.test(keep.textDecoration)) n.style.textDecorationLine = keep.textDecoration;
      } else if (n.nodeType !== 3) n.remove();
    }
  })(t.content);
  return t.innerHTML;
}

const PX_ROWS = [
  '.....HHHHHH.....',
  '.....H....H..YY.',

  '.OLLLLLLLLLLLLO.',
  '.ORRRRRKKRRRRRO.',

const PX_COL = { H: '#5f6f74', Y: '#f2c14e', O: '#33292a', L: '#f08f73', R: '#d9584a', D: '#9b3a32', K: '#f6d36b', S: '#b5463c' };
function pixelSVG() {
  let r = '';
  PX_ROWS.forEach((row, y) => {
    let x = 0;
    while (x < row.length) {
      const c = row[x]; let n = 1;
      while (x + n < row.length && row[x + n] === c) n++;
      if (PX_COL[c]) r += `<rect x="${x}" y="${y}" width="${n}" height="1" fill="${PX_COL[c]}"/>`;
      x += n;
    }
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 12" shape-rendering="crispEdges">${r}</svg>`;
}

function fitGrid(grid, n, target = 1.25) {
  const r = grid.getBoundingClientRect(); if (!r.width || !r.height || !n) return;
  let best = 1, bestScore = Infinity;
  for (let c = 1; c <= n; c++) {
    const rows = Math.ceil(n / c); const ratio = (r.width / c) / (r.height / rows);
    const score = Math.abs(Math.log(ratio / target)) + (c * rows - n) * 0.12;
    if (score < bestScore) { bestScore = score; best = c; }
  }
  grid.style.gridTemplateColumns = `repeat(${best}, minmax(0,1fr))`;
  grid.style.gridTemplateRows = `repeat(${Math.ceil(n / best)}, minmax(0,1fr))`;
}

      toast('Scores reset', { label: 'Undo', fn: () => { d.groups.forEach((g, i) => { g.score = old[i]; }); ctx.save(); draw(); } });
    }
    function change(i, sign) {

    }
    function layout() {
      const r = grid.getBoundingClientRect(); const n = d.groups.length; if (!r.width || !r.height) return;
      let best = 1, bestScore = Infinity;
      for (let c = 1; c <= n; c++) {
        const rows = Math.ceil(n / c); const ratio = (r.width / c) / (r.height / rows);
        const score = Math.abs(Math.log(ratio / 1.25)) + (c * rows - n) * 0.12;
        if (score < bestScore) { bestScore = score; best = c; }
      }
      grid.style.gridTemplateColumns = `repeat(${best}, minmax(0,1fr))`;
      grid.style.gridTemplateRows = `repeat(${Math.ceil(n / best)}, minmax(0,1fr))`;
    }
    function draw() {
      grid.textContent = '';
      const max = Math.max(...d.groups.map(g => g.score));
      const leaders = d.groups.filter(g => g.score === max).length;
      d.groups.forEach((g, i) => {
        const lead = d.leader && max > 0 && leaders === 1 && g.score === max;
        const name = h('div', { class: 'pt-name', contenteditable: 'plaintext-only', spellcheck: 'false', title: 'Click to rename' });
        name.textContent = g.name;
        name.addEventListener('input', () => { g.name = name.textContent; ctx.save(); });

          h('div', { class: 'pt-top' }, lead ? h('span', { class: 'pt-star', text: '★', title: 'Leading' }) : null, name),
          h('div', { class: 'pt-main' },
            h('button', { class: 'pt-btn minus', type: 'button', 'aria-label': 'Deduct points', title: 'Deduct points', onclick: () => change(i, -1) }, icon('minus')),
            h('div', { class: 'pt-score', text: g.score < 0 ? '−' + Math.abs(g.score) : String(g.score), 'aria-live': 'polite' }),
            h('button', { class: 'pt-btn plus', type: 'button', 'aria-label': 'Add points', title: 'Add points', onclick: () => change(i, 1) }, icon('plus')))));
      });
      layout();
    }
    const ro = new ResizeObserver(layout); ro.observe(grid);
    draw();
    return { destroy() { ro.disconnect(); } };
  },
  settings(w, ctx) {
    const d = w.data;
    return [
      field('Number of groups (1–10)', stepper(d.groups.length, 1, 10, 1, v => {

    ];
  },

/* ============================================================

function openTimerSettings(w, ctx) {
  const d = w.data, isA = w.type === 'analog';

  const tot = Math.round(d.duration / 1000);
  const sH = stepper(Math.floor(tot / 3600), 0, 23), sM = stepper(Math.floor((tot % 3600) / 60), 0, 59), sS = stepper(tot % 60, 0, 59);
  sM.input.setAttribute('data-autofocus', '');
  const setTotal = s => { sH.set(Math.floor(s / 3600)); sM.set(Math.floor((s % 3600) / 60)); sS.set(s % 60); };
  const err = h('p', { class: 'form-err', role: 'alert' });
  const presets = [1, 2, 3, 5, 10, 15, 20, 30, 45, 60, 90];

    h('div', { class: 'form-sec' }, h('h3', { text: 'Time' }),
      h('div', { class: 'hms' }, field('Hours', sH.el), field('Minutes', sM.el), field('Seconds', sS.el)),
      h('div', { class: 'chips' }, presets.map(m => h('button', { class: 'chip', type: 'button', onclick: () => setTotal(m * 60) }, m < 60 ? m + ' min' : m === 60 ? '1 hour' : '1½ hours'))))

    secs.push(h('div', { class: 'form-sec' }, h('h3', { text: 'Disc scale' }),
      radios('scale', [['auto', 'Classic 60-minute face (switches to full disc for times over 1 hour)'], ['full', 'Full disc always equals the time set']], opt.scale, v => { opt.scale = v; }),
      h('div', { style: 'margin-top:10px' }, checkbox('Show the time in numbers under the disc', opt.showDigits, v => { opt.showDigits = v; }))));
  } else {
    const thrBox = h('div', { class: 'form-row', style: 'margin-top:12px;gap:18px' });
    let sA, sR;
    const drawThr = () => {
      thrBox.textContent = '';
      const pct = opt.cueBy === 'percent';
      sA = stepper(opt.amber, pct ? 1 : 0.5, pct ? 99 : 600, pct ? 5 : 0.5, v => { opt.amber = v; });
      sR = stepper(opt.red, pct ? 1 : 0.5, pct ? 99 : 600, pct ? 5 : 0.5, v => { opt.red = v; });
      thrBox.append(field(pct ? 'Amber when % of time left is' : 'Amber when minutes left are', sA.el), field(pct ? 'Red when % of time left is' : 'Red when minutes left are', sR.el));
    };
    drawThr();
    secs.push(h('div', { class: 'form-sec' }, h('h3', { text: 'Colour cue' }),

      h('div', { class: 'cue-preview', 'aria-hidden': 'true' },
        h('span', { style: 'background:#e8f1e5;color:#2b5836', text: 'Green' }),
        h('span', { style: 'background:#f8eed7;color:#74510f', text: 'Amber' }),
        h('span', { style: 'background:#f6e3de;color:#86392f', text: 'Red' })),
      h('div', { style: 'margin-top:12px' }, radios('cueBy', [['percent', 'Change colour by % of time left'], ['minutes', 'Change colour by minutes left']], opt.cueBy, v => {
        opt.cueBy = v;
        if (v === 'percent') { opt.amber = 50; opt.red = 20; } else { opt.amber = 2; opt.red = 1; }
        drawThr();
      })), thrBox));
    secs.push(h('div', { class: 'form-sec' }, checkbox('Show a progress bar', opt.bar, v => { opt.bar = v; })));
  }
  secs.push(h('div', { class: 'form-sec' }, h('h3', { text: 'Sound' }),
    h('div', { class: 'form-row' }, checkbox('Play a soft chime when time is up', opt.chime, v => { opt.chime = v; }),
      h('button', { class: 'btn small', type: 'button', onclick: () => chime() }, icon('bell'), 'Test chime'))));
  secs.push(err);
  openModal({
    title: isA ? 'Visual timer' : 'Countdown',

    actions: [{ label: 'Cancel' }, {
      label: 'Apply', kind: 'primary', onClick: () => {
        const ms = (sH.get() * 3600 + sM.get() * 60 + sS.get()) * 1000;
        if (ms <= 0) { err.textContent = 'Set a time longer than 0 seconds.'; return false; }
        if (!isA && opt.cue && opt.red >= opt.amber) { err.textContent = 'The red number must be smaller than the amber number.'; return false; }

  });

          ib('down', 'Move down', () => { if (i < list.length - 1) { [list[i + 1], list[i]] = [list[i], list[i + 1]]; draw(); } }),
          ib('trash', 'Delete step', () => { list.splice(i, 1); draw(); })),
        h('div', { class: 'se-row' }, field('Step title', t), field('Minutes (0 = no timer)', tm.el)),
        field('Instructions (start a line with "- " for a bullet point; type … for a blank)', tx),
        h('div', { class: 'field' }, h('span', { text: 'Sentence starters shown with this step' }), chips)));
    });
  }
  draw();
  const add = h('button', { class: 'btn small', type: 'button', onclick: () => { list.push({ title: 'New step', time: 3, text: '', starters: [] }); draw(); box.lastElementChild.scrollIntoView({ block: 'nearest' }); } }, icon('plus'), 'Add step');
  const reset = h('button', { class: 'btn small', type: 'button', onclick: async () => {
    if (await confirmBox('Reset steps?', `Go back to the default ${R.short} steps? Your edits to the steps will be lost.`, 'Reset', true)) { list = R.steps(); draw(); }
  } }, icon('reset'), 'Reset to default steps');
  openModal({
    title: `Edit steps — ${R.label}`, wide: true,
    body: h('div', { class: 'form' }, box, h('div', { class: 'form-row' }, add, reset)),
    actions: [{ label: 'Cancel' }, { label: 'Save steps', kind: 'primary', onClick: () => {

      const steps = routineSteps(d); d.idx = clamp(d.idx, 0, Math.max(0, steps.length - 1));
      if (steps[d.idx]) tSet(d.timer, Math.max(0.5, steps[d.idx].time || 0) * 60000);
      ctx.save(); ctx.rerender(); toast('Steps saved');
    } }],
  });
}
function openStartersEditor() {
  let cur = 'presenting';
  const work = {}; for (const k of Object.keys(STARTER_CATS)) work[k] = startersFor(k).join('\n');
  const list = h('div', { class: 'cm-list' });

  function drawList() {
    list.textContent = '';
    Object.entries(STARTER_CATS).forEach(([k, c]) => list.append(h('button', { type: 'button', class: 'cm-item' + (k === cur ? ' on' : ''), onclick: () => { work[cur] = ta.value; cur = k; load(); } }, h('span', { text: c.label }))));
  }
  function load() { ta.value = work[cur]; note.textContent = ''; drawList(); ta.focus(); }
  const reset = h('button', { class: 'btn small', type: 'button', onclick: () => { ta.value = DEFAULT_STARTERS[cur].join('\n'); note.textContent = 'Default starters restored. Press Save to keep them.'; } }, icon('reset'), 'Reset this set');
  openModal({
